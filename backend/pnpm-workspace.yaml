# Overrides de sécurité (forçage de versions patchées pour les dépendances
# transitives signalées par Dependabot). pnpm 10 lit les overrides depuis ce
# fichier et non plus depuis le champ « pnpm » de package.json.
#
# Les clés scopées (« pkg@major ») ne ciblent que la ligne de version vulnérable :
# un override global casserait les consommateurs restés sur un ancien major.
overrides:
  # même major que la version résolue → sûr
  handlebars: 4.7.9
  fast-uri: 3.1.4
  form-data: 4.0.6
  multer: 2.2.0
  ip-address: 10.1.1
  qs: 6.15.2
  webpack: 5.104.1
  lodash: 4.18.1
  "@babel/core": 7.29.6
  # scopés : on ne touche que le major vulnérable
  "ajv@8": 8.18.0
  "brace-expansion@1": 1.1.16
  "brace-expansion@2": 2.1.2
  "js-yaml@3": 3.15.0
  "js-yaml@4": 4.3.0
  "uuid@11": 11.1.1
  "tmp@0.2": 0.2.7
  "picomatch@2": 2.3.2
  "glob@10": 10.5.0
  "path-to-regexp@0.1.12": 0.1.13
  "body-parser@1": 1.20.6
  "picomatch@4": 4.0.4
  # NON traités (patch uniquement dans un major supérieur — cross-major risqué, à résorber
  # par des bumps de parents dans une vague dédiée) :
  #  - tar@6 (node-gyp > cacache@15, dev) : patch en 7.x ;
  #  - @nestjs/core@10 : patch en 11.1.18 → migration Nest 11 ;
  #  - file-type@17/@20 (runtime) : patch en 21.x (ESM-only) ;
  #  - @tootallnate/once@1 (dev, low) : patch en 2.0.1 ;
  #  - uuid@3/@8/@9 (vieux parents) : patch en 11.1.1 (le major 11 est déjà forcé).
