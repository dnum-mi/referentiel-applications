  /api/v2/applications/{applicationId}:
    get:
      description: "

        Ce endpoint permet de récupérer les détails complets d'une application
        en fonction de son identifiant unique.


        Le paramètre **id** doit être fourni dans l'URL.

        \    "
      operationId: ApplicationController_findOne
      parameters:
        - name: applicationId
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: Application trouvée avec succès
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationDto"
      summary: Récupérer une application spécifique par ID
      tags: *a7
    patch:
      description: " Ce endpoint permet de mettre à jour une application existante.\ 

        \    Vous devez fournir l'identifiant de l'application dans l'URL et les
        nouvelles données dans le corps de la requête. Les données de mise à
        jour doivent correspondre aux champs.

        \    "
      operationId: ApplicationController_update
      parameters:
        - name: applicationId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchApplicationDto"
      responses:
        "200":
          description: Application mise à jour avec succès
          content:
            application/json:
              schema:
