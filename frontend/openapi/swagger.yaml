      operationId: TechnicalDebtController_getTechnicalDebtPoints
      parameters:
        - name: page
          required: false
          in: query
          description: Numéro de page
          schema:
            minimum: 0
            example: 0
            type: number
        - name: pageSize
          required: false
          in: query
          description: Nombre de résultats par page, 0 pour supprimer la pagination
          schema:
            minimum: 0
            maximum: 100
            default: 15
            example: 15
            type: number
        - name: sortBy
          required: false
          in: query
          description: Champ utilisé pour le tri
          schema:
            example: label
            type: string
        - name: order
          required: false
          in: query
          description: Ordre de tri
          schema:
            example: asc
            type: string
            enum:
              - asc
              - desc
        - name: search
          required: false
          in: query
          description: Recherche sur les labels et shortName
          schema:
            example: Mon Application
            type: string
        - name: q
          required: false
          in: query
          description: Recherche full-text sur l'ensemble des informations descriptives de
            la fiche (libellé, nom court, description, finalités, populations
            cibles, tags, labels, acteurs). Insensible à la casse et aux
            accents, avec lemmatisation française et tri par pertinence. Tous
            les mots saisis doivent être présents (ET) ; la ponctuation est
            ignorée.
          schema:
            maxLength: 200
            example: gestion des factures
            type: string
        - name: qPrefix
          required: false
          in: query
          description: Recherche full-text en mode préfixe, pour l'autocomplétion au fil
            de la frappe (chaque mot saisi est traité comme un préfixe). Même
            périmètre que `q`. Prioritaire sur `q` s'il est fourni. Limité aux
            200 résultats les plus pertinents.
          schema:
            maxLength: 200
            example: tow muel
            type: string
        - name: label
          required: false
          in: query
          description: Recherche par label
          schema:
            example: Mon Application
            type: string
        - name: shortName
          required: false
          in: query
          description: Recherche par shortName
          schema:
            type: string
        - name: tag
          required: false
          in: query
          description: Filtrer par tags (un ou plusieurs)
          schema:
            type: array
            items:
              type: string
        - name: priorityRestart
          required: false
          in: query
          description: Filtrer par une ou plusieurs priorités de redémarrage (R0 à R3)
          schema:
            example:
              - R1
              - R2
            type: array
            items:
              type: string
              enum:
                - R0
                - R1
                - R1_STAR
                - R2
                - R3
        - name: actorType
          required: false
          in: query
          description: Type d'acteur. Utiliser les valeurs de /actorTypes
          schema:
            example: MOA
            type: string
        - name: actorEmail
          required: false
          in: query
          description: Email d'un acteur pour filtrer les applications
          schema:
            example: user@example.com
            type: string
        - name: missingMoa
          required: false
          in: query
          description: Filtrer les applications sans MOA
          schema:
            example: true
            type: boolean
        - name: missingMoe
          required: false
          in: query
          description: Filtrer les applications sans MOE
          schema:
            example: true
            type: boolean
        - name: missingHosting
          required: false
          in: query
          description: Filtrer les applications sans hébergement
          schema:
            example: true
            type: boolean
        - name: currentStatus__in
          required: false
          in: query
          description: Filtrer par un ou plusieurs status du statut courant
          schema:
            type: array
            items:
              type: string
              enum:
                - under_construction
                - to_validate
                - poc
                - in_production_mvp
                - in_production
                - in_production_decommissioning
                - decommissioned
                - deleted
        - name: currentStatus__isNull
          required: false
          in: query
          description: Filtrer les applications sans statut
          schema:
            example: true
            type: boolean
        - name: subscribersEmail
          required: false
          in: query
          description: Filtrer les applications abonné
          schema:
            example: true
            type: boolean
        - name: myApplications
          required: false
          in: query
          description: Filtrer les applications par acteur et groupe acteurs
          schema:
            example: true
            type: boolean
        - name: organization
          required: false
          in: query
          description: Nom de l'organisation liée à l'application
          schema:
            example: Direction des systèmes d'information
            type: string
        - name: hostingSearch
          required: false
          in: query
          description: Recherche unifiée sur tous les champs d'hébergement (site,
            plateforme, fournisseur, bâtiment, salle)
          schema:
            example: Paris
            type: string
        - name: hostingSite
          required: false
          in: query
          description: Filtrer par site d'hébergement
          schema:
            example: Paris
            type: string
        - name: hostingPlatform
          required: false
          in: query
          description: Filtrer par plateforme d'hébergement
          schema:
            example: AWS
            type: string
        - name: hostingProvider
          required: false
          in: query
          description: Filtrer par fournisseur d'hébergement
          schema:
            example: Amazon
            type: string
        - name: hostingBuilding
          required: false
          in: query
          description: Filtrer par bâtiment d'hébergement
          schema:
            example: Bâtiment A
            type: string
        - name: hostingRoom
          required: false
          in: query
          description: Filtrer par pièce d'hébergement
          schema:
            example: Salle 101
            type: string
        - name: compliance__in
          required: false
          in: query
          description: "[Déprécié] Filtrer par conformité présente. Utiliser plutôt
            compliancePresent__in."
          deprecated: true
          schema:
            type: array
            items:
              type: string
              enum:
                - dima
                - pdma
                - homologation
                - rgaa
                - dsfr
                - rgpd
                - pra
        - name: compliancePresent__in
          required: false
          in: query
          description: Critères de conformité devant être présents (renseignés) sur
            l'application
          schema:
            type: array
            items:
              type: string
              enum:
                - dima
                - pdma
                - homologation
                - rgaa
                - dsfr
                - rgpd
                - pra
        - name: complianceAbsent__in
          required: false
          in: query
          description: "Critères de conformité absents : pour un critère booléen (pra,
            dsfr) = explicitement Non (false) ; pour les autres = non renseigné"
          schema:
            type: array
            items:
              type: string
              enum:
                - dima
                - pdma
                - homologation
                - rgaa
                - dsfr
                - rgpd
                - pra
        - name: complianceUnset__in
          required: false
          in: query
          description: Critères de conformité non renseignés (valeur nulle). Pertinent
            pour les critères booléens (pra, dsfr)
          schema:
            type: array
            items:
              type: string
              enum:
                - dima
                - pdma
                - homologation
                - rgaa
                - dsfr
                - rgpd
                - pra
        - name: link
          required: false
          in: query
          description: Recherche par lien (ressource externe)
          schema:
            type: string
        - name: iqGte
          required: false
          in: query
