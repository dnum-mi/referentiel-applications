info:
  title: API Référentiel Applications
  description: API pour la gestion des applications
  version: "2.0"
  contact: {}
tags: []
servers: []
components:
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: http://localhost:8082/realms/referentiel-applications/protocol/openid-connect/auth
          tokenUrl: http://localhost:8082/realms/referentiel-applications/protocol/openid-connect/token
          scopes:
            openid: OpenID scope
            profile: Profile scope
      description: OAuth2 authentication using Keycloak
  schemas:
    relationType:
      type: string
      enum:
        - is_part_of
        - in_replacement_of
        - is_service_user_of
        - is_data_user_of
    RelationApplicationDto:
      type: object
      properties:
        applicationTargetId:
          type: string
        type:
          example: is_part_of
          $ref: "#/components/schemas/relationType"
      required:
        - applicationTargetId
        - type
    RelationDto:
      type: object
      properties:
        id:
          type: string
        applicationSourceId:
          type: string
        applicationTargetId:
          type: string
        sourceApplication:
          type: object
          properties:
            id:
              required: true
              type: string
            label:
              required: true
              type: string
        targetApplication:
          type: object
          properties:
            id:
              required: true
              type: string
            label:
              required: true
              type: string
        type:
          example: is_part_of
          $ref: "#/components/schemas/relationType"
      required:
        - id
        - applicationSourceId
        - applicationTargetId
        - sourceApplication
        - targetApplication
        - type
    MetadataAction:
      type: string
      description: Action effectuée sur la metadata
      enum:
        - add
        - update
        - delete
    UserEntity:
      type: object
      properties:
        keycloakId:
          type: string
        email:
          type: string
        adminLevel:
          enum:
            - 0
            - 10
            - 20
            - 30
          type: number
        organizationId:
          type: string
          nullable: true
        lastLogin:
          format: date-time
          type: string
          nullable: true
      required:
        - keycloakId
        - email
        - adminLevel
        - organizationId
        - lastLogin
    MetadataDto:
      type: object
      properties:
        id:
          type: string
          description: ID de la metadata
          example: 5708d232-8338-4abf-8f38-8370acc89497
        applicationId:
          type: string
          nullable: true
          description: ID de l'application liée
          example: 5708d232-8338-4abf-8f38-8370acc89497
        action:
          example: add
          $ref: "#/components/schemas/MetadataAction"
        actorId:
          type: string
          nullable: true
          description: ID de l'acteur lié à la metadata
          example: 5708d232-8338-4abf-8f38-8370acc89497
        createdAt:
          type: string
          description: Date de création de la metadata
          example: 2023-10-01T12:00:00Z
        complianceId:
          type: string
          nullable: true
          description: ID de la conformité liée à la metadata
          example: 5708d232-8338-4abf-8f38-8370acc89497
        createdById:
          type: string
          description: ID de l'utilisateur qui a créé la metadata
          example: 5708d232-8338-4abf-8f38-8370acc89497
        dataOwnerId:
          type: string
          nullable: true
          description: ID du propriétaire des données lié à la metadata
          example: 5708d232-8338-4abf-8f38-8370acc89497
        description:
          type: string
          nullable: true
          description: Description de la metadata
          example: Initial metadata
        externalRessourceId:
          type: string
          nullable: true
          description: ID de la ressource externe liée à la metadata
          example: 5708d232-8338-4abf-8f38-8370acc89497
        hostingId:
          type: string
          nullable: true
          description: ID de l'hébergement lié à la metadata
          example: 5708d232-8338-4abf-8f38-8370acc89497
        labelId:
          type: string
          nullable: true
          description: ID du label liée à la metadata
          example: 5708d232-8338-4abf-8f38-8370acc89497
        createdBy:
          description: Utilisateur qui a créé la metadata
          allOf:
            - $ref: "#/components/schemas/UserEntity"
      required:
        - id
        - applicationId
        - action
        - actorId
        - createdAt
        - complianceId
        - createdById
        - dataOwnerId
        - description
        - externalRessourceId
        - hostingId
        - labelId
        - createdBy
    FirstLastMetadataDto:
      type: object
      properties:
        first:
          nullable: true
          description: La première metadata de l'application
          allOf:
            - $ref: "#/components/schemas/MetadataDto"
        last:
          type: string
          nullable: true
          description: La dernière metadata de l'application
      required:
        - first
        - last
    UpdateUserDto:
      type: object
      properties:
        adminLevel:
          enum:
            - 0
            - 10
            - 20
            - 30
          type: number
    ApplicationPriorityRestart:
      type: string
      enum:
        - R0
        - R1
        - R1_STAR
        - R2
        - R3
    ApplicationStatus:
      type: string
      description: Current status of the application
      enum:
        - under_construction
        - in_production_mvp
        - in_production
        - in_production_decommissioning
        - decommissioned
        - deleted
    CreateLabelDto:
      type: object
      properties:
        source:
          type: string
          nullable: true
          example: CODE_PAI
          description: Source of the label
        value:
          type: string
          example: short-app-name
          description: Value of the label
      required:
        - source
        - value
    CreateApplicationDto:
      type: object
      properties:
        label:
          type: string
          example: My Application
          description: Label of the application
        shortName:
          type: string
          example: short-app-name
          description: Short name of the application
        logo:
          type: string
          example: http://example.com/logo.png
          description: Logo URL of the application
        description:
          type: string
          example: An amazing application
          description: Description of the application
        targetPopulations:
          example: &a18
            - population 1
            - population 2
          description: population associated with the application
          type: array
          items:
            type: string
        priorityRestart:
          $ref: "#/components/schemas/ApplicationPriorityRestart"
        purposes:
          example: &a19
            - finance
            - HR
          description: Purposes of the application
          type: array
          items:
            type: string
        tags:
          example: &a20
            - tag1
            - tag2
          description: Tags associated with the application
          type: array
          items:
            type: string
        status:
          $ref: "#/components/schemas/ApplicationStatus"
        labels:
          description: Liste des labels alternatifs associés à l’application
          example: &a21
            - source: ""
              value: My App
          type: array
          items:
            $ref: "#/components/schemas/CreateLabelDto"
      required:
        - label
        - description
        - labels
    ApplicationDto:
      type: object
      properties:
        logo:
          type: string
          nullable: true
          example: https://example.com/logo.png
          description: URL of the application logo
        status:
          $ref: "#/components/schemas/ApplicationStatus"
        priorityRestart:
          $ref: "#/components/schemas/ApplicationPriorityRestart"
        id:
          type: string
        label:
          type: string
        shortName:
          type: string
          nullable: true
        description:
          type: string
        targetPopulations:
          type: array
          items:
            type: string
        purposes:
          type: array
          items:
            type: string
        tags:
          type: array
          items:
            type: string
        ownerId:
          type: string
        quality:
          type: number
          nullable: true
      required:
        - logo
        - id
        - label
        - shortName
        - description
        - targetPopulations
        - purposes
        - tags
        - ownerId
        - quality
    CountByMonthDto:
      type: object
      properties:
        month:
          type: string
          description: Month in YYYY-MM format
          example: 2023-10
        total:
          type: number
          description: Total number of applications for the month
          example: 150
      required:
        - month
        - total
    CountByIqDto:
      type: object
      properties:
        iq:
          type: number
          description: Indice de qualité de l'application
          example: 85
        total:
          type: number
          description: Total d'applications pour cet indice de qualité
          example: 30
      required:
        - iq
        - total
    ApplicationSearchResultDto:
      type: object
      properties:
        results:
          description: Liste des applications correspondant aux critères de recherche
          type: array
          items:
            $ref: "#/components/schemas/ApplicationDto"
        total:
          type: number
          description: Nombre total d'applications correspondant aux critères de recherche
          example: 100
      required:
        - results
        - total
    PatchApplicationDto:
      type: object
      properties:
        label:
          type: string
          example: My Application
          description: Label of the application
        shortName:
          type: string
          example: short-app-name
          description: Short name of the application
        logo:
          type: string
          example: http://example.com/logo.png
          description: Logo URL of the application
        description:
          type: string
          example: An amazing application
          description: Description of the application
        targetPopulations:
          example: *a18
          description: population associated with the application
          type: array
          items:
            type: string
        priorityRestart:
          $ref: "#/components/schemas/ApplicationPriorityRestart"
        purposes:
          example: *a19
          description: Purposes of the application
          type: array
          items:
            type: string
        tags:
          example: *a20
          description: Tags associated with the application
          type: array
          items:
            type: string
        status:
          $ref: "#/components/schemas/ApplicationStatus"
        labels:
          description: Liste des labels alternatifs associés à l’application
          example: *a21
          type: array
          items:
            $ref: "#/components/schemas/CreateLabelDto"
    LabelDto:
      type: object
      properties:
        source:
          type: string
          nullable: true
          example: CODE_PAI
          description: Source of the label
        value:
          type: string
          example: short-app-name
          description: Value of the label
        id:
          type: string
          example: 5708d232-8338-4abf-8f38-8370acc89497
          description: ID of the label
        applicationId:
          type: string
          example: 5708d232-8338-4abf-8f38-8370acc89497
          description: ID of the application to which the label belongs
      required:
        - source
        - value
        - id
        - applicationId
    CreateHostingDto:
      type: object
      properties:
        label:
          type: string
        hostingOptionId:
          type: string
          description: ID of the hosting option
        applicationId:
          type: string
      required:
        - applicationId
    HostingOptionDto:
      type: object
      properties:
        site:
          type: string
          description: Site name (géographique)
          example: CER(RENNES)
        platform:
          type: string
          description: Platform name
          example: PHYSIQUE
        provider:
          type: string
          description: Provider name
          example: DTNUM
        building:
          type: string
          description: Building (optional)
          example: B15
        room:
          type: string
          description: Room (optional)
          example: IT2
        id:
          type: string
          description: Unique identifier of the hosting option
          example: 12345678-1234-1234-1234-123456789012
      required:
        - site
        - platform
        - provider
        - id
    HostingDto:
      type: object
      properties:
        label:
          type: string
        hostingOptionId:
          type: string
          description: ID of the hosting option
        applicationId:
          type: string
        id:
          type: string
        hostingOption:
          $ref: "#/components/schemas/HostingOptionDto"
      required:
        - applicationId
        - id
        - hostingOption
    UpdateHostingDto:
      type: object
      properties:
        label:
          type: string
        hostingOptionId:
          type: string
          description: ID of the hosting option
        applicationId:
          type: string
    CreateAnomalyNotificationRequestDto:
      type: object
      properties:
        applicationId:
          type: string
        description:
          type: string
      required:
        - applicationId
        - description
    GetAnomalyNotificationDto:
      type: object
      properties:
        notifier:
          description: The user who reported the issue
          allOf:
            - $ref: "#/components/schemas/UserEntity"
        id:
          type: string
        applicationId:
          type: string
        application:
          $ref: "#/components/schemas/ApplicationDto"
        notifierId:
          type: string
        description:
          type: string
        status:
          type: string
        createdAt:
          format: date-time
          type: string
        updatedAt:
          format: date-time
          type: string
      required:
        - notifier
        - id
        - applicationId
        - application
        - notifierId
        - description
        - status
        - createdAt
        - updatedAt
    UpdateAnomalyNotificationDto:
      type: object
      properties:
        status:
          type: string
          description: Le nouveau statut de la notification d'anomalie
          enum:
            - in_pending
            - in_progress
            - done
        applicationId:
          type: string
        notifierId:
          type: string
        description:
          type: string
      required:
        - status
    GetIqAvgGroupedDto:
      type: object
      properties:
        label:
          type: string
          example: 2025-07
        moyenne:
          type: number
          example: 78.2
        min:
          type: number
          example: 62
        max:
          type: number
          example: 93
        count:
          type: number
          example: 14
      required:
        - label
        - moyenne
        - min
        - max
        - count
    CreateOrganizationDto:
      type: object
      properties:
        label:
          type: string
          example: Direction de la transformation numérique
          description: Nom de l'organisation
        url:
          type: string
          example: ""
          description: url de l'organisation
        sigle:
          type: string
          example: dtnum
          description: sigle de l'organisation
        parentId:
          type: string
          example: f09ed26a-8415-476a-be3b-ada479291c34
          description: L'identifiant de l'organisation parente
      required:
        - label
    OrganizationDto:
      type: object
      properties:
        id:
          type: string
          example: f09ed26a-8415-476a-be3b-ada479291c34
          description: L'identifiant de l'organisation
        label:
          type: string
          example: Direction de la transformation numérique
          description: Nom de l'organisation
        url:
          type: string
          nullable: true
          example: ""
          description: url de l'organisation
        sigle:
          type: string
          nullable: true
          example: dtnum
          description: sigle de l'organisation
        parentId:
          type: string
          nullable: true
          example: f09ed26a-8415-476a-be3b-ada479291c34
          description: L'identifiant de l'organisation parente
      required:
        - id
        - label
        - url
        - sigle
        - parentId
    PatchOrganizationDto:
      type: object
      properties:
        label:
          type: string
          example: Direction de la transformation numérique
          description: Nom de l'organisation
        url:
          type: string
          example: ""
          description: url de l'organisation
        sigle:
          type: string
          example: dtnum
          description: sigle de l'organisation
        parentId:
          type: string
          example: f09ed26a-8415-476a-be3b-ada479291c34
          description: L'identifiant de l'organisation parente
    CreateActorTypeDto:
      type: object
      properties:
