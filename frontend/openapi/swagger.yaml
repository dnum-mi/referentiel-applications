  /api/v2/applications/{applicationId}/my-perms:
    get:
      operationId: ApplicationController_getMyPerms
      summary: Lister les droits de l'utilisateur sur l'application
      parameters:
        - name: applicationId
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: Droits de l'utilisateur sur l'application
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                  enum:
                    - AppRead
                    - ComplianceWrite
                    - RelationRead
                    - RelationWrite
                    - ActorRead
                    - ActorWrite
                    - ComplianceRead
                    - AppWrite
                    - HostingRead
                    - HostingWrite
                    - LinkRead
                    - LinkWrite
                    - MetadataRead
                    - ReportRead
                    - ReportManage
                    - ReportPost
                    - AppWritePriority
      tags: *a4
  /api/v2/applications/export/excel:
    get:
      operationId: ApplicationController_exportExcel
      summary: Exporter les applications en Excel
      description: >-
        Permet d'exporter les applications en un fichier Excel.
              Vous pouvez ajouter des filtres de recherche pour n'exporter que les applications correspondantes.
              Si aucun filtre n'est appliqué, toutes les applications sont exportées.
