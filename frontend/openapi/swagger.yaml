openapi: 3.0.0
paths:
  /api/v2:
    get:
      description: Returns a simple greeting message from the application.
      operationId: AppController_getHello
      parameters: []
      responses:
        "200":
          description: Returns a greeting message.
          content:
            application/json:
              schema:
                type: string
      summary: Get application greeting
      tags:
        - App
  /api/v2/config:
    get:
      operationId: getConfig
      parameters: []
      responses:
        "200":
          description: Configuration du client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigDto"
      summary: Récupérer la configuration du client
      tags:
        - Config
  /api/v2/tokens:
    get:
      description: Cette méthode permet de récupérer les tokens (applicatifs et
        personnels), avec pagination et filtre optionnel par type.
      operationId: TokenController_list
      parameters:
        - name: page
          required: false
          in: query
          description: Numéro de page
          schema:
            minimum: 0
            example: 0
            type: number
        - name: pageSize
          required: false
          in: query
          description: Nombre de résultats par page, 0 pour supprimer la pagination
          schema:
            minimum: 0
            maximum: 100
            default: 15
            example: 15
            type: number
        - name: sortBy
          required: false
          in: query
          description: Champ utilisé pour le tri
          schema:
            example: label
            type: string
        - name: order
          required: false
          in: query
          description: Ordre de tri
          schema:
            example: asc
            type: string
            enum:
              - asc
              - desc
        - name: kind
          required: false
          in: query
          description: Filtre par type de token (service ou personal)
          schema:
            type: string
            enum:
              - personal
              - service
      responses:
        "200":
          description: Liste paginée des tokens récupérée avec succès
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedTokenDto"
      summary: Récupère les tokens de manière paginée
      tags: &a1
        - tokens
    post:
      description: Cette méthode permet de créer un nouveau token de service.
      operationId: TokenController_createService
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateServiceTokenDto"
      responses:
        "201":
          description: Token créé avec succès
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExposedTokenDto"
      summary: Crée un nouveau token de service
      tags: *a1
  /api/v2/tokens/personal:
    get:
      description: Cette méthode permet de récupérer tous les tokens personnels.
      operationId: TokenController_findPersonal
      parameters: []
      responses:
        "200":
          description: Liste des tokens récupérée avec succès
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TokenDto"
      summary: Récupère tous les tokens personnels
      tags: *a1
    post:
      description: Cette méthode permet de créer un nouveau token personnel.
      operationId: TokenController_createPersonal
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePersonalTokenDto"
      responses:
        "201":
          description: Token créé avec succès
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExposedTokenDto"
      summary: Crée un nouveau token personnel
      tags: *a1
  /api/v2/tokens/{id}/regenerate:
    post:
      description: Cette méthode permet de régénérer un token de service.
      operationId: TokenController_regenerate
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegenerateTokenDto"
      responses:
        "200":
          description: Token régénéré avec succès
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenDto"
      summary: Régénère un token de service
      tags: *a1
  /api/v2/tokens/{id}:
    delete:
      description: Cette méthode permet de supprimer (révoquer) un token de service.
      operationId: TokenController_delete
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        "204":
          description: Token supprimé avec succès
      summary: Supprime (révoque) un token de service
      tags: *a1
  /api/v2/tokens/personal/{id}:
    delete:
      description: Cette méthode permet de supprimer (révoquer) un token personnel.
      operationId: TokenController_deletePersonal
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        "204":
          description: Token supprimé avec succès
      summary: Supprime (révoque) un token personnel
      tags: *a1
  /api/v2/users/me:
    get:
      operationId: UserController_findMe
      parameters: []
      responses:
        "200":
          description: Informations utilisateur trouvées
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserWithPermissions"
        "404":
          description: Utilisateur non trouvé
      summary: Récupérer ses propres informations utilisateur
      tags: &a2
        - users
    patch:
      description: "Permet à un utilisateur de modifier ses propres préférences (ex:
        notifications par email)."
      operationId: UserController_updateMe
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserPreferencesDto"
      responses:
        "200":
          description: Préférences mises à jour avec succès
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserWithPermissions"
        "404":
          description: Utilisateur non trouvé
      summary: Mettre à jour ses propres préférences utilisateur
      tags: *a2
  /api/v2/users/me/subscribe/{appId}:
    post:
      operationId: UserController_subscribe
      parameters:
        - name: appId
          required: true
          in: path
          description: ID de l'application à suivre
          schema:
            type: string
      responses:
        "200":
          description: Abonnement pris en compte
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserWithPermissions"
        "201":
          description: Abonnement pris en compte
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserWithPermissions"
      summary: S'abonner aux notifications d'une application
      tags: *a2
    delete:
      operationId: UserController_unsubscribe
      parameters:
        - name: appId
          required: true
          in: path
          description: ID de l'application à ne plus suivre
          schema:
            type: string
      responses:
        "200":
          description: Désabonnement pris en compte
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserWithPermissions"
      summary: Se désabonner des notifications d'une application
      tags: *a2
  /api/v2/users/by-email/{email}/sync-organization-from-maia:
    get:
      description: Interroge MAIA pour récupérer l'organisation et les informations
        personnelles associées à cet email, sans modifier l'utilisateur en base.
      operationId: UserController_syncOrganizationFromMaiaByEmail
      parameters:
        - name: email
          required: true
          in: path
          description: Email de l'utilisateur
          schema:
            type: string
      responses:
        "200":
          description: Informations MAIA récupérées
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaiaOrganizationSuggestionDto"
        "403":
          description: Accès refusé - Privilège admin requis
        "404":
          description: Utilisateur non trouvé
      summary: Récupérer les informations MAIA d'un utilisateur par email
      tags: *a2
  /api/v2/users/{id}/sync-organization-from-maia:
    post:
      description: Recherche l'utilisateur dans MAIA à partir de son email, crée
        l'organisation si nécessaire, puis l'associe à l'utilisateur ciblé.
      operationId: UserController_syncOrganizationFromMaia
      parameters:
        - name: id
          required: true
          in: path
          description: ID de l'utilisateur
          schema:
            type: string
      responses:
        "200":
          description: Organisation synchronisée avec succès
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserWithPermissions"
        "403":
          description: Accès refusé - Privilège admin requis
        "404":
          description: Utilisateur non trouvé
      summary: Synchroniser l'organisation d'un utilisateur depuis MAIA
      tags: *a2
  /api/v2/users/sync-organizations-from-maia:
    post:
      description: Lance une synchronisation des organisations utilisateurs depuis
        MAIA en tâche de fond.
      operationId: UserController_syncOrganizationsFromMaia
      parameters: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncOrganizationsDto"
      responses:
        "200":
          description: Batch MAIA lancé en tâche de fond
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncOrganizationsResponseDto"
        "403":
          description: Accès refusé - Privilège admin requis
      summary: Synchroniser les organisations depuis MAIA (batch)
      tags: *a2
  /api/v2/users/impersonate/stop:
    post:
      description: Clôture la session d'impersonation active de l'administrateur. À
        appeler en conservant le header d'impersonation pour que le serveur
        identifie l'administrateur réel.
      operationId: UserController_stopImpersonation
      parameters: []
      responses:
        "204":
          description: Impersonation arrêtée
      summary: Arrêter l'impersonation en cours
      tags: *a2
  /api/v2/users/{id}/impersonate:
    post:
      description: "Démarre une session d'impersonation : l'administrateur se fait
        passer pour l'utilisateur cible. Renvoie les informations de
        l'utilisateur impersonné. Accès limité aux administrateurs."
      operationId: UserController_impersonate
      parameters:
        - name: id
          required: true
          in: path
          description: ID de l'utilisateur à impersonner
          schema:
            type: string
      responses:
        "200":
          description: Session d'impersonation démarrée
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserWithPermissions"
        "403":
          description: Accès refusé - Privilège admin requis
        "404":
          description: Utilisateur non trouvé
      summary: Impersonner un utilisateur
      tags: *a2
  /api/v2/users/{id}/block:
    post:
      description: "Empêche un utilisateur de s'authentifier (ex : a quitté
        l'organisation). Rejeté à l'authentification quel que soit le moyen
        d'accès (SSO ou token API). Accès limité aux administrateurs."
      operationId: UserController_block
      parameters:
        - name: id
          required: true
          in: path
          description: ID de l'utilisateur à bloquer
          schema:
            type: string
      responses:
        "200":
          description: Utilisateur bloqué avec succès
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserWithPermissions"
        "403":
          description: Accès refusé - Privilège admin requis
        "404":
          description: Utilisateur non trouvé
      summary: Bloquer l'accès d'un utilisateur
      tags: *a2
  /api/v2/users/{id}/unblock:
    post:
      description: Rétablit l'accès d'un utilisateur précédemment bloqué. Accès limité
        aux administrateurs.
      operationId: UserController_unblock
      parameters:
        - name: id
          required: true
          in: path
          description: ID de l'utilisateur à débloquer
          schema:
            type: string
      responses:
        "200":
          description: Utilisateur débloqué avec succès
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserWithPermissions"
        "403":
          description: Accès refusé - Privilège admin requis
        "404":
          description: Utilisateur non trouvé
      summary: Débloquer l'accès d'un utilisateur
      tags: *a2
  /api/v2/users/{id}:
    patch:
      description: Permet de modifier les permissions d'un utilisateur. Accès limité
        aux administrateurs.
      operationId: UserController_update
      parameters:
        - name: id
          required: true
          in: path
          description: ID de l'utilisateur
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserDto"
      responses:
        "200":
          description: Utilisateur mis à jour avec succès
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserWithPermissions"
        "403":
          description: |-
            Une conformité RGAA existe déjà pour cette application

            Accès refusé - Privilège admin requis
        "404":
          description: Utilisateur non trouvé
      summary: Mettre à jour les permissions d'un utilisateur
      tags: *a2
  /api/v2/users/{id}/permission-logs:
    get:
      description: Retourne l'historique des changements de rôle et de permissions
        d'un utilisateur, avec la date et l'email de l'auteur de chaque
        modification. Accès limité aux administrateurs.
      operationId: UserController_findPermissionLogs
      parameters:
        - name: id
          required: true
          in: path
          description: ID de l'utilisateur
          schema:
            type: string
      responses:
        "200":
          description: Historique des modifications de droits
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserPermissionLogDto"
        "403":
          description: Accès refusé - Privilège admin requis
      summary: Récupérer l'historique des modifications de droits d'un utilisateur
      tags: *a2
  /api/v2/users:
    get:
      description: Récupère la liste de tous les utilisateurs avec leurs permissions.
        Supporte la recherche par email. Accès limité aux administrateurs.
      operationId: UserController_findAll
      parameters:
        - name: page
          required: false
          in: query
          description: Numéro de page
          schema:
            minimum: 0
            example: 0
            type: number
        - name: pageSize
          required: false
          in: query
          description: Nombre de résultats par page, 0 pour supprimer la pagination
          schema:
            minimum: 0
            maximum: 100
            default: 15
            example: 15
            type: number
        - name: sortBy
          required: false
          in: query
          description: Champ utilisé pour le tri
          schema:
            example: label
            type: string
        - name: order
          required: false
          in: query
          description: Ordre de tri
          schema:
            example: asc
            type: string
            enum:
              - asc
              - desc
        - name: type
          required: false
          in: query
          description: Type d'utilisateur. Utiliser les valeurs de /userTypes
          schema:
            default:
              - human
            example:
              - human
            type: array
            items:
              type: string
              enum:
                - human
                - bot
        - name: search
          required: false
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Liste paginée des utilisateurs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedUserWithPermissions"
        "403":
          description: Accès refusé - Privilège admin requis
      summary: Lister tous les utilisateurs
      tags: *a2
  /api/v2/organization-maia-references:
    post:
      operationId: OrganizationMaiaReferencesController_create
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrganizationMaiaReferenceDto"
      responses:
        "201":
          description: Référence créée
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationMaiaReferenceDto"
        "404":
          description: Organisation non trouvée
        "409":
          description: La référence MAIA existe déjà
      summary: Créer une référence MAIA vers une organisation
      tags: &a3
        - organization-maia-references
    get:
      operationId: OrganizationMaiaReferencesController_findAll
      parameters:
        - name: organizationId
          required: false
          in: query
          description: Filtrer par organisation locale
          schema:
            example: f09ed26a-8415-476a-be3b-ada479291c34
            type: string
      responses:
        "200":
          description: Liste des références MAIA
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedOrganizationMaiaReferenceDto"
      summary: Lister les références MAIA
      tags: *a3
  /api/v2/organization-maia-references/{id}:
    delete:
      operationId: OrganizationMaiaReferencesController_remove
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        "204":
          description: Référence supprimée
      summary: Supprimer une référence MAIA
      tags: *a3
  /api/v2/email/logs:
    get:
      operationId: EmailController_findLogs
      parameters:
        - name: page
          required: false
          in: query
          description: Numéro de page
          schema:
            minimum: 0
            example: 0
            type: number
        - name: pageSize
          required: false
          in: query
          description: Nombre de résultats par page, 0 pour supprimer la pagination
          schema:
            minimum: 0
            maximum: 100
            default: 15
            example: 15
            type: number
        - name: sortBy
          required: false
          in: query
          description: Champ utilisé pour le tri
          schema:
            example: label
            type: string
        - name: order
          required: false
          in: query
          description: Ordre de tri
          schema:
            example: asc
            type: string
            enum:
              - asc
              - desc
      responses:
        "200":
          description: Liste paginée de l'historique des e-mails envoyés
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedEmailLogDto"
      summary: Liste l'historique des e-mails envoyés (admin)
      tags: &a4
        - email
  /api/v2/email/digest:
    post:
      operationId: EmailController_runDigest
      parameters:
        - name: day
          required: false
          in: query
          schema:
            type: string
      responses:
        "204":
          description: Digest déclenché
      summary: Exécute le digest email des abonnés (admin)
      tags: *a4
  /api/v2/applications/{applicationId}/metadatas:
    get:
      operationId: ApplicationMetadatasController_find
      parameters:
        - name: applicationId
          required: true
          in: path
          description: ID de l'application
          schema:
            type: string
        - name: page
          required: false
          in: query
          description: Numéro de page
          schema:
            minimum: 0
            example: 0
            type: number
        - name: pageSize
          required: false
          in: query
          description: Nombre de résultats par page, 0 pour supprimer la pagination
          schema:
            minimum: 0
            maximum: 100
            default: 15
            example: 15
            type: number
        - name: sortBy
          required: false
          in: query
          description: Champ utilisé pour le tri
          schema:
            example: label
            type: string
        - name: order
          required: false
          in: query
          description: Ordre de tri
          schema:
            example: asc
            type: string
            enum:
              - asc
              - desc
        - name: createdAtGte
          required: false
          in: query
          description: Date de création minimum (inclusive)
          schema:
            example: 2023-01-01T00:00:00.000Z
            type: string
        - name: createdAtLte
          required: false
          in: query
          description: Date de création maximum (inclusive)
          schema:
            example: 2023-12-31T23:59:59.999Z
            type: string
      responses:
        "200":
          description: Liste des metadatas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedMetadataDto"
      summary: Récupérer toutes les metadatas d'une application
      tags: &a5
        - Metadatas
  /api/v2/applications/{applicationId}/metadatas/first-last:
    get:
      operationId: ApplicationMetadatasController_getFirstAndLastMetadata
      parameters:
        - name: applicationId
          required: true
          in: path
          description: ID de l'application
          schema:
            type: string
      responses:
        "200":
          description: La première et la dernière metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FirstLastMetadataDto"
      summary: Retourne la première et la dernière metadata d'une application
      tags: *a5
  /api/v2/metadatas:
    get:
      operationId: MetadatasController_find
      parameters:
        - name: page
          required: false
          in: query
          description: Numéro de page
          schema:
            minimum: 0
            example: 0
            type: number
        - name: pageSize
          required: false
          in: query
          description: Nombre de résultats par page, 0 pour supprimer la pagination
          schema:
            minimum: 0
            maximum: 100
            default: 15
            example: 15
            type: number
        - name: sortBy
          required: false
          in: query
          description: Champ utilisé pour le tri
          schema:
            example: label
            type: string
        - name: order
          required: false
          in: query
          description: Ordre de tri
          schema:
            example: asc
            type: string
            enum:
              - asc
              - desc
        - name: createdAtGte
          required: false
          in: query
          description: Date de création minimum (inclusive)
          schema:
            example: 2023-01-01T00:00:00.000Z
            type: string
        - name: createdAtLte
          required: false
          in: query
          description: Date de création maximum (inclusive)
          schema:
            example: 2023-12-31T23:59:59.999Z
            type: string
      responses:
        "200":
          description: Récupérer toutes les metadatas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedMetadataDto"
      summary: Récupérer toutes les metadatas
      tags: &a6
        - Metadatas
  /api/v2/metadatas/{id}:
    get:
      operationId: MetadatasController_findOne
      parameters:
        - name: id
          required: true
          in: path
          description: ID de la metadata
          schema:
            type: string
      responses:
        "200":
          description: Détails de la metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetadataDto"
      summary: Récupérer une metadata par son ID
      tags: *a6
  /api/v2/applications:
    post:
      description: "

        **Ce endpoint permet de créer une application complète.**


        Vous devez fournir les informations suivantes :

        - **label**: Le libellé de l'application.

        - **shortName**: Le nom court de l'application.

        - **logo**: L'URL du logo (peut être vide).

        - **description**: Une description détaillée de l'application.

        - **purposes**: Les domaines d'activité (ex: finance, HR, operations).

        - **tags**: Des tags pour catégoriser l'application.

        \  - **firstProductionDate**: Date de première mise en production.

        \  - **plannedDecommissioningDate**: Date prévue de déclassement.

        \  - **source**: La source du libelé.

        \  - **value**: Le libellé alternatif.

        - **compliances**: La liste des conformités associées avec :

        \  - Champs spécifiques selon le type de conformité (DIMA, PDMA,
        HOMOLOGATION, RGAA, DSFR, RGPD).

        \    "
      operationId: ApplicationController_create
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApplicationDto"
      responses:
        "201":
          description: Application créée avec succès.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationDto"
      summary: Créer une nouvelle application
      tags: &a7
        - applications
    get:
      description: >-
        Endpoint unifié pour rechercher, filtrer et paginer les applications.
              Supporte tous les types de filtres : label, shortName, tags, priorityRestart, hostingSearch, etc.
              Inclut la pagination et le tri.
