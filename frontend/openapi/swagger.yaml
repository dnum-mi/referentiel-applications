  /api/v2/stats/iq-avg/period:
    get:
      operationId: StatsController_getIqAvgGrouped
      summary: Récupérer la moyenne des IQ par période
      description: "

        Permet de récupérer la moyenne des IQ par période. \ 

        Vous pouvez spécifier la période en utilisant les paramètres `from` et
        `to`, \ 

        ainsi que le regroupement souhaité avec `groupBy`. \ 


        **Valeurs possibles pour `groupBy` :** \ 

        - `jour` (day) \ 

        - `semaine` (week) \ 

        - `mois` (month) \ 

        - `année` (year) \ 


        **Exemple d’appel :** \ 

        ```http

        GET /stats/iq-avg/period?from=2025-07-01&to=2025-07-23&groupBy=mois

        Authorization: Bearer <TOKEN>

        ```

        \    "
      parameters:
        - name: from
          required: false
          in: query
          description: Date de début au format ISO (ex. 2025-07-01)
          schema:
            example: 2025-07-01
            type: string
        - name: to
          required: false
          in: query
          description: Date de fin au format ISO (ex. 2025-07-23)
          schema:
            example: 2025-07-23
            type: string
        - name: groupBy
          required: false
          in: query
          description: Regroupement souhaité (jour, semaine, mois, année)
          schema:
            enum:
              - jour
              - semaine
              - mois
              - année
            type: string
      responses:
        "200":
          description: Tableau de buckets avec label, moyenne, min, max, count
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GetIqAvgGroupedDto"
      tags:
        - Stats
