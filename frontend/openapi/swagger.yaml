openapi: 3.0.0
paths:
  /api/v2:
    get:
      operationId: AppController_getHello
      summary: Get application greeting
      description: Returns a simple greeting message from the application.
      parameters: []
      responses:
        "200":
          description: Returns a greeting message.
          content:
            application/json:
              schema:
                type: string
  /api/v2/config:
    get:
      operationId: getConfig
      summary: Récupérer la configuration du client
      parameters: []
      responses:
        "200":
          description: Configuration du client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigDto"
      tags:
        - Config
  /api/v2/tokens:
    get:
      operationId: TokenController_list
      summary: Récupère tous les tokens de service
      description: Cette méthode permet de récupérer tous les tokens de service.
      parameters: []
      responses:
        "200":
          description: Liste des tokens récupérée avec succès
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TokenDto"
      tags: &a1
        - tokens
    post:
      operationId: TokenController_createService
      summary: Crée un nouveau token de service
      description: Cette méthode permet de créer un nouveau token de service.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateServiceTokenDto"
      responses:
        "201":
          description: Token créé avec succès
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExposedTokenDto"
      tags: *a1
  /api/v2/tokens/personal:
    get:
      operationId: TokenController_findPersonal
      summary: Récupère tous les tokens personnels
      description: Cette méthode permet de récupérer tous les tokens personnels.
      parameters: []
      responses:
        "200":
          description: Liste des tokens récupérée avec succès
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TokenDto"
      tags: *a1
    post:
      operationId: TokenController_createPersonal
      summary: Crée un nouveau token personnel
      description: Cette méthode permet de créer un nouveau token personnel.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePersonalTokenDto"
      responses:
        "201":
          description: Token créé avec succès
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExposedTokenDto"
      tags: *a1
  /api/v2/tokens/{id}/regenerate:
    post:
      operationId: TokenController_regenerate
      summary: Régénère un token de service
      description: Cette méthode permet de régénérer un token de service.
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegenerateTokenDto"
      responses:
        "200":
          description: Token régénéré avec succès
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenDto"
        "201":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExposedTokenDto"
      tags: *a1
  /api/v2/tokens/{id}:
    delete:
      operationId: TokenController_delete
      summary: Supprime (révoque) un token de service
      description: Cette méthode permet de supprimer (révoquer) un token de service.
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        "204":
          description: Token supprimé avec succès
      tags: *a1
  /api/v2/tokens/personal/{id}:
    delete:
      operationId: TokenController_deletePersonal
      summary: Supprime (révoque) un token personnel
      description: Cette méthode permet de supprimer (révoquer) un token personnel.
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        "204":
          description: Token supprimé avec succès
      tags: *a1
  /api/v2/applications/{applicationId}/metadatas:
    get:
      operationId: ApplicationMetadatasController_find
      summary: Récupérer toutes les metadatas d'une application
      parameters:
        - name: applicationId
          required: true
          in: path
          description: ID de l'application
          schema:
            type: string
        - name: page
          required: false
          in: query
          description: Numéro de page
          schema:
            minimum: 0
            example: 0
            type: number
        - name: pageSize
          required: false
          in: query
          description: Nombre de résultats par page, 0 pour supprimer la pagination
          schema:
            minimum: 0
            maximum: 100
            default: 15
            example: 15
            type: number
        - name: sortBy
          required: false
          in: query
          description: Champ utilisé pour le tri
          schema:
            example: label
            type: string
        - name: order
          required: false
          in: query
          description: Ordre de tri
          schema:
            example: asc
            enum:
              - asc
              - desc
            type: string
        - name: createdAtGte
          required: false
          in: query
          description: Date de création minimum (inclusive)
          schema:
            example: 2023-01-01T00:00:00.000Z
            type: string
        - name: createdAtLte
          required: false
          in: query
          description: Date de création maximum (inclusive)
          schema:
            example: 2023-12-31T23:59:59.999Z
            type: string
      responses:
        "200":
          description: Liste des metadatas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedMetadataDto"
      tags: &a2
        - Metadatas
  /api/v2/applications/{applicationId}/metadatas/first-last:
    get:
      operationId: ApplicationMetadatasController_getFirstAndLastMetadata
      summary: Retourne la première et la dernière metadata d'une application
      parameters:
        - name: applicationId
          required: true
          in: path
          description: ID de l'application
          schema:
            type: string
      responses:
        "200":
          description: La première et la dernière metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FirstLastMetadataDto"
      tags: *a2
  /api/v2/metadatas:
    get:
      operationId: MetadatasController_find
      summary: Récupérer toutes les metadatas
      parameters:
        - name: page
          required: false
          in: query
          description: Numéro de page
          schema:
            minimum: 0
            example: 0
            type: number
        - name: pageSize
          required: false
          in: query
          description: Nombre de résultats par page, 0 pour supprimer la pagination
          schema:
            minimum: 0
            maximum: 100
            default: 15
            example: 15
            type: number
        - name: sortBy
          required: false
          in: query
          description: Champ utilisé pour le tri
          schema:
            example: label
            type: string
        - name: order
          required: false
          in: query
          description: Ordre de tri
          schema:
            example: asc
            enum:
              - asc
              - desc
            type: string
        - name: createdAtGte
          required: false
          in: query
          description: Date de création minimum (inclusive)
          schema:
            example: 2023-01-01T00:00:00.000Z
            type: string
        - name: createdAtLte
          required: false
          in: query
          description: Date de création maximum (inclusive)
          schema:
            example: 2023-12-31T23:59:59.999Z
            type: string
      responses:
        "200":
          description: Récupérer toutes les metadatas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedMetadataDto"
      tags: &a3
        - Metadatas
  /api/v2/metadatas/{id}:
    get:
      operationId: MetadatasController_findOne
      summary: Récupérer une metadata par son ID
      parameters:
        - name: id
          required: true
          in: path
          description: ID de la metadata
          schema:
            type: string
      responses:
        "200":
          description: Détails de la metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetadataDto"
      tags: *a3
  /api/v2/applications:
    post:
      operationId: ApplicationController_create
      summary: Créer une nouvelle application
      description: "

        **Ce endpoint permet de créer une application complète.**


        Vous devez fournir les informations suivantes :

        - **label**: Le libellé de l'application.

        - **shortName**: Le nom court de l'application.

        - **logo**: L'URL du logo (peut être vide).

        - **description**: Une description détaillée de l'application.

        - **purposes**: Les domaines d'activité (ex: finance, HR, operations).

        - **tags**: Des tags pour catégoriser l'application.

        \  - **firstProductionDate**: Date de première mise en production.

        \  - **plannedDecommissioningDate**: Date prévue de déclassement.

        \  - **source**: La source du libelé.

        \  - **value**: Le libellé alternatif.

        - **compliances**: La liste des conformités associées avec :

        \  - Champs spécifiques selon le type de conformité (DIMA, PDMA,
        HOMOLOGATION, RGAA, DSFR, RGPD).

        \    "
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApplicationDto"
      responses:
        "201":
          description: Application créée avec succès.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationDto"
      tags: &a4
        - applications
    get:
      operationId: ApplicationController_search
      summary: Rechercher et filtrer les applications
      description: >-
        Endpoint unifié pour rechercher, filtrer et paginer les applications.
              Supporte tous les types de filtres : label, shortName, tags, priorityRestart, hostingSearch, etc.
              Inclut la pagination et le tri.
      parameters:
        - name: page
          required: false
          in: query
          description: Numéro de page
          schema:
            minimum: 0
            example: 0
            type: number
        - name: pageSize
          required: false
          in: query
          description: Nombre de résultats par page, 0 pour supprimer la pagination
          schema:
            minimum: 0
            maximum: 100
            default: 15
            example: 15
            type: number
        - name: sortBy
          required: false
          in: query
          description: Champ utilisé pour le tri
          schema:
            example: label
            type: string
        - name: order
          required: false
          in: query
          description: Ordre de tri
          schema:
            example: asc
            enum:
              - asc
              - desc
            type: string
        - name: search
          required: false
          in: query
          description: Recherche sur les labels et shortName
          schema:
            example: Mon Application
            type: string
        - name: label
          required: false
          in: query
          description: Recherche par label
          schema:
            example: Mon Application
            type: string
        - name: shortName
          required: false
          in: query
          description: Recherche par shortName
          schema:
            type: string
        - name: tag
          required: false
          in: query
          description: Filtrer par tags (un ou plusieurs)
          schema:
            type: array
            items:
              type: string
        - name: priorityRestart
          required: false
          in: query
          description: Filtrer par une ou plusieurs priorités de redémarrage (R0 à R3)
          schema:
            example:
              - R1
              - R2
            type: array
            items:
              type: string
              enum:
                - R0
                - R1
                - R1_STAR
                - R2
                - R3
        - name: actorType
          required: false
          in: query
          description: Type d'acteur. Utiliser les valeurs de /actorTypes
          schema:
            example: MOA
            type: string
        - name: actorEmail
          required: false
          in: query
          description: Email d'un acteur pour filtrer les applications
          schema:
            example: user@example.com
            type: string
        - name: missingMoa
          required: false
          in: query
          description: Filtrer les applications sans MOA
          schema:
            example: true
            type: boolean
        - name: missingMoe
          required: false
          in: query
          description: Filtrer les applications sans MOE
          schema:
            example: true
            type: boolean
        - name: missingHosting
          required: false
          in: query
          description: Filtrer les applications sans hébergement
          schema:
            example: true
            type: boolean
        - name: currentStatus__in
          required: false
          in: query
          description: Filtrer par un ou plusieurs status du statut courant
          schema:
            type: array
            items:
              type: string
              enum:
                - under_construction
                - to_validate
                - poc
                - in_production_mvp
                - in_production
                - in_production_decommissioning
                - decommissioned
                - deleted
        - name: currentStatus__isNull
          required: false
          in: query
          description: Filtrer les applications sans statut
          schema:
            example: true
            type: boolean
        - name: organization
          required: false
          in: query
          description: Nom de l'organisation liée à l'application
          schema:
            example: Direction des systèmes d'information
            type: string
        - name: hostingSearch
          required: false
          in: query
          description: Recherche unifiée sur tous les champs d'hébergement (site,
            plateforme, fournisseur, bâtiment, salle)
          schema:
            example: Paris
            type: string
        - name: hostingSite
          required: false
          in: query
          description: Filtrer par site d'hébergement
          schema:
            example: Paris
            type: string
        - name: hostingPlatform
          required: false
          in: query
          description: Filtrer par plateforme d'hébergement
          schema:
            example: AWS
            type: string
        - name: hostingProvider
          required: false
          in: query
          description: Filtrer par fournisseur d'hébergement
          schema:
            example: Amazon
            type: string
        - name: hostingBuilding
          required: false
          in: query
          description: Filtrer par bâtiment d'hébergement
          schema:
            example: Bâtiment A
            type: string
        - name: hostingRoom
          required: false
          in: query
          description: Filtrer par pièce d'hébergement
          schema:
            example: Salle 101
            type: string
        - name: compliance__in
          required: false
          in: query
          description: Filtrer par conformité
          schema:
            type: array
            items:
              type: string
              enum:
                - dima
                - pdma
                - homologation
                - rgaa
                - dsfr
        - name: link
          required: false
          in: query
          description: Recherche par lien (ressource externe)
          schema:
            type: string
        - name: iqGte
          required: false
          in: query
          description: Recherche par indice de qualité minimum
          schema:
            minimum: 0
            default: 0
            type: number
        - name: iqLte
          required: false
          in: query
          description: Recherche par indice de qualité maximum
          schema:
            maximum: 100
            default: 100
            type: number
        - name: columns
          required: false
          in: query
          description: Colonnes à inclure dans l'export
          schema:
            example: id,label,shortName,description
            type: string
        - name: isActor
          required: false
          in: query
          description: "Ne retourne que les applications dont l'utilisateur est acteur,
            defaut: false"
          schema:
            default: false
            type: string
        - name: is_part_of
          required: false
          in: query
          description: Filtrée sur la relation de type Fait partie de
          schema:
            enum:
              - NEUTRAL
              - INCLUDE
              - EXCLUDE
            type: string
        - name: in_replacement_of
          required: false
          in: query
          description: Filtrée sur la relation de type Remplace
          schema:
            enum:
              - NEUTRAL
              - INCLUDE
              - EXCLUDE
            type: string
        - name: is_service_user_of
          required: false
          in: query
          description: Filtrée sur la relation de type Utilise le service de
          schema:
            enum:
              - NEUTRAL
              - INCLUDE
              - EXCLUDE
            type: string
        - name: is_data_user_of
          required: false
          in: query
          description: Filtrée sur la relation de type Utilise la donnée de
          schema:
            enum:
              - NEUTRAL
              - INCLUDE
              - EXCLUDE
            type: string
        - name: use_sso_of
          required: false
          in: query
          description: Filtrée sur la relation de type Utilise le SSO de
          schema:
            enum:
              - NEUTRAL
              - INCLUDE
              - EXCLUDE
            type: string
        - name: relationAppId
          required: false
          in: query
          description: Filtrage des relations sur cette app
          schema:
            type: string
        - name: businessDivisionId
          required: false
          in: query
          description: Filtrage des directions de metier MOA
          schema:
            nullable: true
            type: string
        - name: is_mediation_service
          required: false
          in: query
          description: Filtrée sur la mediation de service
          schema:
            enum:
              - NEUTRAL
              - INCLUDE
              - EXCLUDE
            type: string
      responses:
        "200":
          description: Liste des applications correspondant aux critères de recherche avec
            pagination.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationSearchResultDto"
      tags: *a4
  /api/v2/applications/count-by-month:
    get:
      operationId: ApplicationController_countByMonth
      summary: Liste le nombre d'applications sur les 6 derniers mois
      parameters: []
