      tags: &a23
        - ApplicationReports
    get:
      operationId: ApplicationReportsController_findAll
      summary: Récupérer tous les signalements pour une application
      description: Renvoie la liste paginée des signalements pour une application donnée.
      parameters:
        - name: all
          required: false
          in: query
          description: Filtrer les signalements pour l'utilisateur connecté
          schema:
            default: false
            type: boolean
        - name: searchReport
          required: false
          in: query
          schema:
            type: string
        - name: sortBy
          required: false
          in: query
          schema:
            enum:
              - application
              - status
              - date
              - description
              - notifier
              - notes
            type: string
        - name: order
          required: false
          in: query
          schema:
            enum:
              - asc
              - desc
            type: string
        - name: page
          required: false
          in: query
          schema:
            minimum: 0
            type: number
        - name: limit
          required: false
          in: query
          schema:
            minimum: 1
            type: number
        - name: applicationId
          required: true
          in: path
          description: ID de l'application
          schema:
            type: string
      responses:
        "200":
          description: Liste paginée des signalements pour l'application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedReportDto"
      tags: *a23
  /api/v2/applications/{applicationId}/reports/{id}:
    get:
      operationId: ApplicationReportsController_findOne
      summary: Récupérer un signalement spécifique par ID
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
        - name: applicationId
          required: true
          in: path
          description: ID de l'application
          schema:
            type: string
      responses:
        "200":
          description: Signalement trouvé avec succès
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportDto"
      tags: *a23
    patch:
      operationId: ApplicationReportsController_update
      summary: Mettre à jour un signalement
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
        - name: notify
          required: true
          in: query
          description: Send Notification Email
          schema:
            example: "true"
            type: boolean
        - name: applicationId
          required: true
          in: path
          description: ID de l'application
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateReportDto"
      responses:
        "200":
          description: Signalement mis à jour avec succès
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportDto"
      tags: *a23
    delete:
      operationId: ApplicationReportsController_remove
      summary: Supprimer un signalement
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
        - name: applicationId
          required: true
          in: path
          description: ID de l'application
          schema:
            type: string
      responses:
        "204":
          description: Signalement supprimé avec succès
      tags: *a23
  /api/v2/health-check:
    get:
      operationId: HealthCheckController_checkHealth
      summary: Vérification de la santé de l'application
      description: Exécute une requête basique vers la base de données pour vérifier
        la connectivité et l'état global de l'application.
      parameters: []
      responses:
        "200":
          description: L'application fonctionne correctement.
          content:
            application/json:
              schema:
                example:
                  status: ok
        "500":
          description: Le service n'est pas disponible en raison d'une erreur lors de la
            connexion à la base de données.
          content:
            application/json:
              schema:
                example:
                  status: error
                  message: Détail de l'erreur
      tags:
        - Health Check
info:
  title: API Référentiel Applications
  description: API pour la gestion des applications
  version: "2.0"
  contact: {}
tags: []
servers: []
components:
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: http://localhost:8082/realms/referentiel-applications//protocol/openid-connect/auth
          tokenUrl: http://localhost:8082/realms/referentiel-applications//protocol/openid-connect/token
          refreshUrl: http://localhost:8082/realms/referentiel-applications//protocol/openid-connect/token
          scopes:
            openid: OpenID scope
            profile: Profile scope
      description: OAuth2 authentication using OIDC
    api_key:
      type: apiKey
      in: header
      name: x-refapp-token
      description: Token authentication
  schemas:
    FooterLinkDto:
      type: object
      properties:
        label:
          type: string
          description: Link label
          example: Documentation
        title:
          type: string
          description: Link title (tooltip)
          example: Aller à la documentation
        href:
          type: string
          description: Link URL
          example: https://documentation.example.com
      required:
        - label
        - title
        - href
    ConfigDto:
      type: object
      properties:
        oidcConfigUrl:
          type: string
          description: OIDC configuration URL
          example: https://auth.sso.interieur.rie.gouv.fr/.well-known/openid-configuration
        oidcClientId:
          type: string
          description: OIDC client ID
          example: my-client-id
        version:
          type: string
          description: Backend version
          example: 1.0.0
        environmentLabel:
          type: string
          description: Environment label displayed in the header badge
          example: developpement
        footerLinks:
          description: Footer links to display in the application footer
          type: array
          items:
            $ref: "#/components/schemas/FooterLinkDto"
      required:
        - oidcConfigUrl
        - oidcClientId
        - version
        - footerLinks
    Roles:
      type: string
      description: Role attribué a un utilisateur
      enum:
        - VISITOR
        - READER
        - CONTRIBUTOR
        - ADMIN
    TokenDto:
      type: object
      properties:
        id:
          type: string
          example: abc123def456ghi789jkl012mno345pq
          description: Identifiant unique du token
        role:
          $ref: "#/components/schemas/Roles"
        description:
          type: string
          example: Token pour l'application X
          description: Description du token
        name:
          type: string
          example: Service X
          description: Nom du service ou de l'application utilisant le token
        expiresAt:
          type: string
          example: 2023-12-31T23:59:59.999Z
          description: Date d'expiration du token, au format ISO 8601, maximum 1 an dans
            le futur
        status:
          type: object
          example: active
          description: Statut du token
      required:
        - id
        - description
        - name
        - status
    CreateServiceTokenDto:
      type: object
      properties:
        role:
          $ref: "#/components/schemas/Roles"
        description:
          type: string
          example: Token pour l'application X
          description: Description du token
        name:
          type: string
          example: Service X
          description: Nom du service ou de l'application utilisant le token
        expiresAt:
          type: string
          example: 2023-12-31T23:59:59.999Z
          description: Date d'expiration du token, au format ISO 8601, maximum 1 an dans
            le futur
      required:
        - role
        - description
        - name
    ExposedTokenDto:
      type: object
      properties:
        id:
          type: string
          example: abc123def456ghi789jkl012mno345pq
          description: Identifiant unique du token
        role:
          $ref: "#/components/schemas/Roles"
        description:
          type: string
          example: Token pour l'application X
          description: Description du token
        name:
          type: string
          example: Service X
          description: Nom du service ou de l'application utilisant le token
        expiresAt:
          type: string
          example: 2023-12-31T23:59:59.999Z
          description: Date d'expiration du token, au format ISO 8601, maximum 1 an dans
            le futur
        status:
          type: object
          example: active
          description: Statut du token
        password:
          type: string
          example: xyz987uvw654rst321opq098nml765kj
          description: Valeur du token (ne sera pas stockée, à afficher une seule fois)
      required:
        - id
        - description
        - name
        - status
        - password
    CreatePersonalTokenDto:
      type: object
      properties:
        role:
          $ref: "#/components/schemas/Roles"
        description:
          type: string
          example: Token pour l'application X
          description: Description du token
        name:
          type: string
          example: Service X
          description: Nom du service ou de l'application utilisant le token
        expiresAt:
          type: string
          example: 2023-12-31T23:59:59.999Z
          description: Date d'expiration du token, au format ISO 8601, maximum 1 an dans
            le futur
      required:
        - description
        - name
    RegenerateTokenDto:
      type: object
      properties:
        expiresAt:
          type: string
          example: 2023-12-31T23:59:59.999Z
          description: Date d'expiration du token, au format ISO 8601, maximum 1 an dans
            le futur
    MetadataAction:
      type: string
      description: Action effectuée sur la metadata
      enum:
        - add
        - update
        - delete
        - export
    ApplicationLightDto:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
      required:
        - id
        - label
    OrganizationDto:
      type: object
      properties:
        id:
          type: string
          example: f09ed26a-8415-476a-be3b-ada479291c34
          description: L'identifiant de l'organisation
        path:
          type: string
          example: Direction de la transformation numérique
          description: Nom de l'organisation
        url:
          type: string
          nullable: true
          example: ""
          description: url de l'organisation
        sigle:
          type: string
          nullable: true
          example: dtnum
          description: sigle de l'organisation
        parentId:
          type: string
          nullable: true
          example: f09ed26a-8415-476a-be3b-ada479291c34
          description: L'identifiant de l'organisation parente
        businessDivisionId:
          type: string
          nullable: true
          example: f09ed26a-8415-476a-be3b-ada479291c34
          description: L'identifiant de la direction métier associée
      required:
        - id
        - path
        - url
        - sigle
        - parentId
        - businessDivisionId
    UserType:
      type: string
      enum:
        - human
        - bot
    UserFollowedApplicationDto:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
      required:
        - id
        - label
    Permission:
      type: string
      description: Liste des permissions lié au role d'un user
      enum:
        - CreateApplication
        - DeleteApplication
        - CreateGlobalReport
        - MDITList
        - AppList
        - DataExport
        - AdminPanelManage
        - ActorTypePost
        - ActorTypeManage
        - ActorTypeDelete
        - OrganizationManage
        - AppRead
        - AppWrite
        - ActorRead
        - ActorWrite
        - ComplianceRead
        - ComplianceWrite
        - HostingRead
        - HostingWrite
        - RelationRead
        - RelationWrite
        - LinkRead
        - LinkWrite
        - AppWritePriority
        - MetadataRead
        - ReportRead
        - ReportPost
        - ReportManage
    UserEntity:
      type: object
      properties:
        role:
          $ref: "#/components/schemas/Roles"
        organization:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/OrganizationDto"
        type:
          $ref: "#/components/schemas/UserType"
        emailNotificationsEnabled:
          type: boolean
          description: Préférence de notification par email
          default: true
        followedApplications:
          description: Applications suivies par l'utilisateur
          type: array
          items:
            $ref: "#/components/schemas/UserFollowedApplicationDto"
        additionalPermissions:
          type: array
          items:
            $ref: "#/components/schemas/Permission"
        id:
          type: string
        email:
          type: string
        organizationId:
          type: string
          nullable: true
      required:
        - role
        - type
        - additionalPermissions
        - id
        - email
        - organizationId
    MetadataDto:
      type: object
      properties:
        id:
          type: string
          description: ID de la metadata
          example: 5708d232-8338-4abf-8f38-8370acc89497
        applicationId:
          type: string
          nullable: true
          description: ID de l'application liée
          example: 5708d232-8338-4abf-8f38-8370acc89497
        action:
          example: add
          $ref: "#/components/schemas/MetadataAction"
        actorId:
          type: string
          nullable: true
          description: ID de l'acteur lié à la metadata
          example: 5708d232-8338-4abf-8f38-8370acc89497
        createdAt:
          type: string
          description: Date de création de la metadata
          example: 2023-10-01T12:00:00Z
        complianceId:
          type: string
          nullable: true
          description: ID de la conformité liée à la metadata
          example: 5708d232-8338-4abf-8f38-8370acc89497
        createdById:
          type: string
          description: ID de l'utilisateur qui a créé la metadata
          example: 5708d232-8338-4abf-8f38-8370acc89497
        dataOwnerId:
          type: string
          nullable: true
          description: ID du propriétaire des données lié à la metadata
          example: 5708d232-8338-4abf-8f38-8370acc89497
        description:
          type: string
          nullable: true
          description: Description de la metadata
          example: Initial metadata
        externalRessourceId:
          type: string
          nullable: true
          description: ID de la ressource externe liée à la metadata
          example: 5708d232-8338-4abf-8f38-8370acc89497
        hostingId:
          type: string
          nullable: true
          description: ID de l'hébergement lié à la metadata
          example: 5708d232-8338-4abf-8f38-8370acc89497
        labelId:
          type: string
          nullable: true
          description: ID du label liée à la metadata
          example: 5708d232-8338-4abf-8f38-8370acc89497
        application:
          $ref: "#/components/schemas/ApplicationLightDto"
        createdBy:
          description: Utilisateur qui a créé la metadata
          allOf:
            - $ref: "#/components/schemas/UserEntity"
      required:
        - id
        - applicationId
        - action
        - actorId
        - createdAt
        - complianceId
        - createdById
        - dataOwnerId
        - description
        - externalRessourceId
        - hostingId
        - labelId
        - createdBy
    PaginatedMetadataDto:
      type: object
      properties:
        results:
          description: Array of results
          type: array
          items:
            $ref: "#/components/schemas/MetadataDto"
        total:
          type: number
          description: Total number of items
          example: 100
      required:
        - results
        - total
    FirstLastMetadataDto:
      type: object
      properties:
        first:
          nullable: true
          description: La première metadata de l'application
          allOf:
            - $ref: "#/components/schemas/MetadataDto"
        last:
          nullable: true
          description: La dernière metadata de l'application
          allOf:
            - $ref: "#/components/schemas/MetadataDto"
      required:
        - first
        - last
    ApplicationPriorityRestart:
      type: string
      enum:
        - R0
        - R1
        - R1_STAR
        - R2
        - R3
    ApplicationType:
      type: string
      description: Type of the application
      enum:
        - business
        - core_service
        - intranet_citizen
        - intranet_staff
        - data_hub
    ApplicationStatus:
      type: string
      description: Statut de l'application
      enum:
        - under_construction
        - to_validate
        - poc
        - in_production_mvp
        - in_production
        - in_production_decommissioning
        - decommissioned
        - deleted
    CreateApplicationStatusDto:
      type: object
      properties:
        status:
          $ref: "#/components/schemas/ApplicationStatus"
        statusDate:
          format: date-time
          type: string
          nullable: true
          description: Date optionnelle du changement de statut
        version:
          type: string
          nullable: true
          description: Version du statut
      required:
        - status
    CreateApplicationDto:
      type: object
      properties:
        label:
          type: string
          minLength: 2
          example: My Application
          description: Label of the application
        shortName:
          type: string
          example: short-app-name
          description: Short name of the application
        logo:
          type: string
          example: http://example.com/logo.png
          description: Logo URL of the application
        description:
          type: string
          example: An amazing application
          description: Description of the application
        targetPopulations:
          example: &a24
            - population 1
            - population 2
          description: population associated with the application
          type: array
          items:
            type: string
        priorityRestart:
          $ref: "#/components/schemas/ApplicationPriorityRestart"
        purposes:
          example: &a25
            - finance
            - HR
          description: Purposes of the application
          type: array
          items:
            type: string
        type:
          example: business
          $ref: "#/components/schemas/ApplicationType"
        tags:
          example: &a26
            - tag1
            - tag2
          type: array
          items:
            type: string
        status:
          description: Statut initial de l'application
          example:
            status: under_construction
            statusDate: 2024-01-15T10:30:00Z
          allOf:
            - $ref: "#/components/schemas/CreateApplicationStatusDto"
        businessDivisionId:
          type: string
          nullable: true
          description: Id de la direction de metier de l'application MOA
      required:
        - label
        - description
    ApplicationStatusDto:
      type: object
      properties:
        id:
          type: string
          description: ID unique du statut
        applicationId:
          type: string
          description: ID de l'application
        status:
          $ref: "#/components/schemas/ApplicationStatus"
        statusDate:
          format: date-time
          type: string
          description: Date du changement de statut
        version:
          type: string
          nullable: true
          description: Version du statut
      required:
        - id
        - applicationId
        - status
        - statusDate
    TechnicalDebtInfoDto:
      type: object
      properties:
        technicalMaturity:
          type: number
          minimum: 0
          maximum: 5
          example: 3.2
          description: Technical maturity score (0-5)
        businessMaturity:
          type: number
          minimum: 0
          maximum: 5
          example: 4.5
          description: Business maturity score (0-5)
        costMaturity:
          type: number
          minimum: 0
          maximum: 5
          example: 2.75
          description: Cost maturity score (0-5)
        id:
          type: string
          example: uuid-example
          description: Unique identifier
        applicationId:
          type: string
          example: uuid-example
          description: Application ID
      required:
        - id
        - applicationId
    BusinessDivisionDTO:
      type: object
      properties:
        id:
          type: string
          description: Identifiant unique de la division DTO
        label:
          type: string
          description: Nom unique du business division
          example: farm
      required:
        - id
        - label
    ApplicationDto:
      type: object
      properties:
        logo:
          type: string
          nullable: true
          example: https://example.com/logo.png
          description: URL of the application logo
        status:
          $ref: "#/components/schemas/ApplicationStatus"
        priorityRestart:
          $ref: "#/components/schemas/ApplicationPriorityRestart"
        currentStatus:
          nullable: true
          description: Current status of the application with full details
          allOf:
            - $ref: "#/components/schemas/ApplicationStatusDto"
        technicalDebtInfo:
          nullable: true
          description: Technical debt information for the application
          allOf:
            - $ref: "#/components/schemas/TechnicalDebtInfoDto"
        businessDivision:
          nullable: true
          description: Business division MOA for the application
          allOf:
            - $ref: "#/components/schemas/BusinessDivisionDTO"
        id:
          type: string
        label:
          type: string
        shortName:
          type: string
          nullable: true
        description:
          type: string
        targetPopulations:
          type: array
          items:
            type: string
        purposes:
          type: array
          items:
            type: string
        quality:
          type: number
          nullable: true
      required:
        - logo
        - id
        - label
        - shortName
        - description
        - targetPopulations
        - purposes
        - quality
    CountByMonthDto:
      type: object
      properties:
        month:
          type: string
          description: Month in YYYY-MM format
          example: 2023-10
        total:
          type: number
          description: Total number of applications for the month
          example: 150
      required:
        - month
        - total
    CountByIqDto:
      type: object
      properties:
        iq:
          type: number
          description: Indice de qualité de l'application
          example: 85
        total:
          type: number
          description: Total d'applications pour cet indice de qualité
          example: 30
      required:
        - iq
        - total
    ApplicationSearchResultDto:
      type: object
      properties:
        results:
          description: Liste des applications correspondant aux critères de recherche
          type: array
          items:
            $ref: "#/components/schemas/ApplicationDto"
        total:
          type: number
          description: Total number of items
          example: 100
        averageIq:
          type: number
          description: IQ moyen calculé sur l'ensemble des applications correspondant aux
            critères (toutes pages confondues)
          example: 72.5
          nullable: false
      required:
        - results
        - total
        - averageIq
    PatchApplicationDto:
      type: object
      properties:
        label:
          type: string
          minLength: 2
          example: My Application
          description: Label of the application
        shortName:
          type: string
          example: short-app-name
          description: Short name of the application
        logo:
          type: string
          example: http://example.com/logo.png
          description: Logo URL of the application
        description:
          type: string
          example: An amazing application
          description: Description of the application
        targetPopulations:
          example: *a24
          description: population associated with the application
          type: array
          items:
            type: string
        priorityRestart:
          $ref: "#/components/schemas/ApplicationPriorityRestart"
        purposes:
          example: *a25
          description: Purposes of the application
          type: array
          items:
            type: string
        type:
          example: business
          $ref: "#/components/schemas/ApplicationType"
        tags:
          example: *a26
          type: array
          items:
            type: string
        businessDivisionId:
          type: string
          nullable: true
          description: Id de la direction de metier de l'application MOA
    UpdateApplicationStatusDto:
      type: object
      properties:
        status:
          $ref: "#/components/schemas/ApplicationStatus"
        statusDate:
          format: date-time
          type: string
          nullable: true
          description: Date optionnelle du changement de statut
        version:
          type: string
          nullable: true
          description: Version du statut
    CreateTagDto:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
          description: Nom unique du tag
          example: securite
      required:
        - name
    TagDto:
      type: object
      properties:
        id:
          type: string
          description: Identifiant unique du tag
        name:
          type: string
          minLength: 2
          maxLength: 100
          pattern: /^[a-z._-]+$/
          description: Nom unique du tag
          example: securite
        createdAt:
          type: string
          description: Date de création du tag
          example: 2025-01-01T00:00:00.000Z
      required:
        - id
        - name
        - createdAt
    PaginatedTagDto:
      type: object
      properties:
        results:
          description: Array of results
          type: array
          items:
            $ref: "#/components/schemas/TagDto"
        total:
          type: number
          description: Total number of items
          example: 100
      required:
        - results
        - total
    UpdateTagDto:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
          description: Nom unique du tag
          example: securite
    PaginatedBusinessDivisionDTO:
      type: object
      properties:
        results:
          description: Array of results
          type: array
          items:
            $ref: "#/components/schemas/BusinessDivisionDTO"
        total:
          type: number
          description: Total number of items
          example: 100
