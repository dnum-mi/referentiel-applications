  /api/v2/applications/{applicationId}/data-source:
    post:
      operationId: DataSourceController_create
      summary: Créer une nouvelle source de donnée
      description: "

        **Ce endpoint permet de créer une source de donnée complète liée à une
        application.**


        Informations traitées :

        - **Nom** : Nom d'usage.

        - **Description** : Description détaillée.

        - **IsReference** : Indicateur \"Source Maître\". S'il est à true, cette
        application est la source officielle, unique et faisant foi pour cette
        donnée au sein du ministère.

        - **Exemple** : Échantillon de données.

        - **Conservation** : Durée d'Utilité Administrative (DUA).


        - **DatabaseName** : Nom de l'instance de la base de données hôte.

        - **DatabaseTableName** : Nom technique de l'entité contenant les
        données.

        - **FieldCount** : Nombre total de colonnes ou de champs que contient la
        source de donnée.

        - **Fields** : Liste textuelle des champs/colonnes.

        - **Volumetry** : Représente le nombre actuel d'enregistrements présents
        dans la source.

        - **MonthlyVolumetry** : Estimation du nombre de nouveaux
        enregistrements ajoutés chaque mois.


        - **TypeId** : Lien vers la nature technique du support.

        - **SensibilityId** : Lien vers le niveau de protection et de criticité.

        - **FamilyId** : Lien vers la classification thématique.

        - **UpdateFrequencyId** : Lien vers le rythme de rafraîchissement des
        données.

        \    "
      parameters:
        - name: applicationId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDataSourceDto"
      responses:
        "201":
          description: Source de donnée créée avec succès.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataSourceDto"
      tags: &a8
        - Data Sources
