      responses:
        "200":
          description: Export Excel des applications
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        "403":
          description: Accès refusé - Privilège admin requis
      tags: *a4
