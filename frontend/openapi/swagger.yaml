            type: string
        - name: isActor
          required: false
          in: query
          description: "Ne retourne que les applications dont l'utilisateur est acteur,
            defaut: false"
          schema:
            default: false
            type: string
        - name: is_part_of
          required: false
          in: query
          description: Filtrée sur la relation de type Fait partie de
          schema:
            type: string
