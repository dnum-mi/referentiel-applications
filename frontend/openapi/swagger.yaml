openapi: 3.0.0
paths:
  /api/v2:
    get:
      operationId: AppController_getHello
      summary: Get application greeting
      description: Returns a simple greeting message from the application.
      parameters: []
      responses:
        "200":
          description: Returns a greeting message.
          content:
            application/json:
              schema:
                type: string
  /api/v2/applications/{applicationId}/relations:
    post:
      operationId: RelationController_create
      summary: Créer une nouvelle relation
      description: Permet de créer une relation entre deux applications.
      parameters:
        - name: applicationId
          required: true
          in: path
          description: ID de l'application SOURCE
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RelationApplicationDto"
      responses:
        "201":
          description: Relation créée avec succès
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RelationDto"
      tags: &a1
        - relation
    get:
      operationId: RelationController_findAll
      summary: Récupérer toutes les relations d'une application
      description: Renvoie la liste de toutes les relations d'une application donnée.
      parameters:
        - name: applicationId
          required: true
          in: path
          description: ID de l'application SOURCE
          schema:
            type: string
      responses:
        "200":
          description: Liste des relations trouvées
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RelationDto"
      tags: *a1
  /api/v2/applications/{applicationId}/relations/{id}:
    get:
      operationId: RelationController_findOne
      summary: Récupérer une relation par son identifiant unique
      parameters:
        - name: id
          required: true
          in: path
          description: Identifiant unique de la relation
          schema:
            type: string
      responses:
        "200":
          description: Relation trouvée avec succès
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RelationDto"
      tags: *a1
    patch:
      operationId: RelationController_update
      summary: Mettre à jour une relation
      parameters:
        - name: id
          required: true
          in: path
          description: Identifiant unique de la relation à mettre à jour
          schema:
            type: string
        - name: applicationId
          required: true
          in: path
          description: ID de l'application SOURCE
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RelationApplicationDto"
      responses:
        "200":
          description: Relation mise à jour avec succès
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RelationDto"
      tags: *a1
    delete:
      operationId: RelationController_delete
      summary: Supprimer une relation
      parameters:
        - name: id
          required: true
          in: path
          description: Identifiant unique de la relation à supprimer
          schema:
            type: string
        - name: applicationId
          required: true
          in: path
          description: ID de l'application SOURCE
          schema: {}
      responses:
        "204":
          description: Relation supprimée avec succès
      tags: *a1
  /api/v2/applications/{applicationId}/metadatas:
    get:
      operationId: ApplicationMetadataController_findAll
      summary: Récupérer toutes les metadatas d'une application
      parameters:
        - name: applicationId
          required: true
          in: path
          description: ID de l'application
          schema:
            type: string
      responses:
        "200":
          description: Liste des metadatas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MetadataDto"
      tags: &a2
        - Metadatas
  /api/v2/applications/{applicationId}/metadatas/first-last:
    get:
      operationId: ApplicationMetadataController_getFirstAndLastMetadata
      summary: Retourne la première et la dernière metadata d'une application
      parameters:
        - name: applicationId
          required: true
          in: path
          description: ID de l'application
          schema:
            type: string
      responses:
        "200":
          description: La première et la dernière metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FirstLastMetadataDto"
      tags: *a2
  /api/v2/users/me:
    get:
      operationId: UserController_findMe
      summary: Récupérer ses propres informations utilisateur
      parameters: []
      responses:
        "200":
          description: Informations utilisateur trouvées
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserEntity"
        "404":
          description: Utilisateur non trouvé
      tags: &a3
        - users
  /api/v2/users/{id}:
    patch:
      operationId: UserController_update
      summary: Mettre à jour les permissions d'un utilisateur
      description: Permet de modifier les permissions d'un utilisateur. Accès limité
        aux administrateurs.
      parameters:
        - name: id
          required: true
          in: path
          description: ID Keycloak de l'utilisateur
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserDto"
      responses:
        "200":
          description: Utilisateur mis à jour avec succès
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserEntity"
        "403":
          description: Accès refusé - Privilège admin requis
        "404":
          description: Utilisateur non trouvé
      tags: *a3
  /api/v2/users:
    get:
      operationId: UserController_findAll
      summary: Lister tous les utilisateurs
      description: Récupère la liste de tous les utilisateurs avec leurs permissions.
        Supporte la recherche par email et ID Keycloak. Accès limité aux
        administrateurs.
      parameters:
        - name: search
          required: false
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Liste des utilisateurs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserEntity"
        "403":
          description: Accès refusé - Privilège admin requis
      tags: *a3
  /api/v2/applications:
    post:
      operationId: ApplicationController_create
      summary: Créer une nouvelle application
      description: "

        **Ce endpoint permet de créer une application complète.**


        Vous devez fournir les informations suivantes :

        - **label**: Le libellé de l'application.

        - **shortName**: Le nom court de l'application.

        - **logo**: L'URL du logo (peut être vide).

        - **description**: Une description détaillée de l'application.

        - **purposes**: Les domaines d'activité (ex: finance, HR, operations).

        - **tags**: Des tags pour catégoriser l'application.

        \  - **firstProductionDate**: Date de première mise en production.

        \  - **plannedDecommissioningDate**: Date prévue de déclassement.

        - **labels**: Les différents libellés alternatifs de l'application.

        \  - **source**: La source du libelé.

        \  - **value**: Le libellé alternatif.

        - **compliances**: La liste des conformités associées avec :

        \  - Champs spécifiques selon le type de conformité (DIMA, PDMA,
        HOMOLOGATION, RGAA, DSFR, RGPD).

        \    "
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApplicationDto"
      responses:
        "201":
          description: Application créée avec succès.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationDto"
      tags: &a4
        - applications
    get:
      operationId: ApplicationController_findAll
      summary: Récupérer les applications
      description: "

        Ce endpoint permet de récupérer la liste de toutes les applications
        existantes dans le système.


        Aucun paramètre n'est requis pour accéder à cette liste.

        \    "
      parameters: []
      responses:
        "200":
          description: Liste des applications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApplicationDto"
      tags: *a4
  /api/v2/applications/count-by-status:
    get:
      operationId: ApplicationController_count
      summary: Compte le nombre d'applications hors statut supprimé
      parameters: []
      responses:
        "200":
          description: Nombre d'applications actives
          content:
            application/json:
              schema:
                type: number
      tags: *a4
  /api/v2/applications/count-by-month:
    get:
      operationId: ApplicationController_countByMonth
      summary: Liste le nombre d'applications sur les 6 derniers mois
      parameters: []
      responses:
        "200":
          description: Nombre d'applications par mois
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CountByMonthDto"
      tags: *a4
  /api/v2/applications/count-by-iq:
    get:
      operationId: ApplicationController_countByIq
      summary: Liste le nombre d'applications par indice de qualité (de 0% à 100%)
      parameters: []
      responses:
        "200":
          description: Nombre d'applications par indice de qualité
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CountByIqDto"
      tags: *a4
  /api/v2/applications/search:
    get:
      operationId: ApplicationController_search
      summary: Rechercher et filtrer les applications
      description: >-
        Endpoint unifié pour rechercher, filtrer et paginer les applications.
              Supporte tous les types de filtres : label, shortName, tags, priorityRestart, hostingSearch, etc.
              Inclut la pagination et le tri.
      parameters:
        - name: search
          required: false
          in: query
          description: Recherche plein texte sur tous les champs
          schema:
            example: Mon Application
            type: string
        - name: label
          required: false
          in: query
          description: Recherche par label
          schema:
            example: Mon Application
            type: string
        - name: shortName
          required: false
          in: query
          description: Recherche par shortName
          schema:
            type: string
        - name: tag
          required: false
          in: query
          description: Filtrer par tags (un ou plusieurs)
          schema:
            type: array
            items:
              type: string
        - name: priorityRestart
          required: false
          in: query
          description: Filtrer par une ou plusieurs priorités de redémarrage (R0 à R3)
          schema:
            example: &a5
              - R1
              - R2
            type: array
            items: &a6
              type: string
              enum:
                - R0
                - R1
                - R1_STAR
                - R2
                - R3
        - name: actorType
          required: false
          in: query
          description: Type d'acteur. Utiliser les valeurs de /actorTypes
          schema:
            example: MOA
            type: string
        - name: status
          required: false
          in: query
          description: Filtrer par un ou plusieurs status
          schema:
            type: array
            items: &a7
              type: string
              enum:
                - under_construction
                - in_production_mvp
                - in_production
                - in_production_decommissioning
                - decommissioned
                - deleted
        - name: organizationLabel
          required: false
          in: query
          description: Nom de l'organisation liée à l'application
          schema:
            example: Direction des systèmes d'information
            type: string
        - name: hostingSearch
          required: false
          in: query
          description: Recherche unifiée sur tous les champs d'hébergement (site,
            plateforme, fournisseur, bâtiment, salle)
          schema:
            example: Paris
            type: string
        - name: link
          required: false
          in: query
          description: Recherche par lien (ressource externe)
          schema:
            type: string
        - name: iqGte
          required: false
          in: query
          description: Recherche par indice de qualité minimum
          schema:
            minimum: 0
            default: 0
            type: number
        - name: iqLte
          required: false
          in: query
          description: Recherche par indice de qualité maximum
          schema:
            maximum: 100
            default: 100
            type: number
        - name: page
          required: false
          in: query
          description: Numéro de page
          schema:
            minimum: 0
            example: 0
            type: number
        - name: limit
          required: false
          in: query
          description: Nombre de résultats par page
          schema:
            minimum: 1
            example: 15
            type: number
        - name: sortBy
          required: false
          in: query
          description: Champ utilisé pour le tri
          schema:
            example: label
            type: string
        - name: order
          required: false
          in: query
          description: Ordre de tri
          schema:
            example: asc
            enum: &a8
              - asc
              - desc
            type: string
        - name: columns
          required: false
          in: query
          description: Colonnes à inclure dans l'export
          schema:
            example: '["id", "label", "shortName", "description"]'
            type: array
        - required: false
          description: Recherche plein texte sur tous les champs
          name: search
          in: query
          schema:
            example: Mon Application
            type: string
        - required: false
          description: Recherche par label
          name: label
          in: query
          schema:
            example: Mon Application
            type: string
        - required: false
          description: Recherche par shortName
          name: shortName
          in: query
          schema:
            type: string
        - required: false
          description: Filtrer par tags (un ou plusieurs)
          name: tag
          in: query
          schema:
            type: array
            items:
              type: string
        - required: false
          description: Filtrer par une ou plusieurs priorités de redémarrage (R0 à R3)
          name: priorityRestart
          in: query
          schema:
            example: *a5
            type: array
            items: *a6
        - required: false
          description: Type d'acteur. Utiliser les valeurs de /actorTypes
          name: actorType
          in: query
          schema:
            example: MOA
            type: string
        - required: false
          description: Filtrer par un ou plusieurs status
          name: status
          in: query
          schema:
            type: array
            items: *a7
        - required: false
          description: Nom de l'organisation liée à l'application
          name: organizationLabel
          in: query
          schema:
            example: Direction des systèmes d'information
            type: string
        - required: false
          description: Recherche unifiée sur tous les champs d'hébergement (site,
            plateforme, fournisseur, bâtiment, salle)
          name: hostingSearch
          in: query
          schema:
            example: Paris
            type: string
        - required: false
          description: Recherche par lien (ressource externe)
          name: link
          in: query
          schema:
            type: string
        - required: false
          description: Recherche par indice de qualité minimum
          name: iqGte
          in: query
          schema:
            minimum: 0
            default: 0
            type: number
        - required: false
          description: Recherche par indice de qualité maximum
          name: iqLte
          in: query
          schema:
            maximum: 100
            default: 100
            type: number
        - required: false
          description: Numéro de page
          name: page
          in: query
          schema:
            minimum: 0
            example: 0
            type: number
        - required: false
          description: Nombre de résultats par page
          name: limit
          in: query
          schema:
            minimum: 1
            example: 15
            type: number
        - required: false
          description: Champ utilisé pour le tri
          name: sortBy
          in: query
          schema:
            example: label
            type: string
        - required: false
          description: Ordre de tri
          name: order
          in: query
          schema:
            example: asc
            enum: *a8
            type: string
        - required: false
          description: Colonnes à inclure dans l'export
          name: columns
          in: query
          schema:
            example: '["id", "label", "shortName", "description"]'
            type: array
      responses:
        "200":
          description: Liste des applications correspondant aux critères de recherche avec
            pagination.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationSearchResultDto"
      tags: *a4
  /api/v2/applications/{applicationId}/my-perms:
    get:
      operationId: ApplicationController_getMyPerms
      summary: Lister les droits de l'utilisateur sur l'application
      parameters:
        - name: applicationId
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: Droits de l'utilisateur sur l'application
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                  enum:
                    - readBase
                    - writeCompliances
                    - readRelations
                    - writeRelations
                    - readActors
                    - writeActors
                    - readCompliances
                    - writeBase
                    - readHostings
                    - writeHostings
                    - readLinks
                    - writeLinks
                    - readMetadata
                    - writeMetadata
      tags: *a4
