worker_processes 4;

events { worker_connections 1024; }

# Directive to run nginx as non-root user
pid        /tmp/nginx.pid;

http {
    # https://github.com/dnum-mi/basegun/issues/407
    server_tokens off;

    server {
        listen 8080;
        root  /usr/share/nginx/html;
        include /etc/nginx/mime.types;

        location / {
          try_files $uri $uri/ /index.html;
        }

        # Assets hashés par Vite : le nom de fichier change à chaque build,
        # on peut donc les mettre en cache indéfiniment.
        location /assets/ {
          add_header Cache-Control "public, max-age=31536000, immutable";
          try_files $uri =404;
        }

        # Fichiers pilotant la mise à jour de l'application (#2149) : toujours
        # revalidés auprès du serveur, sinon les utilisateurs restent bloqués
        # sur une ancienne version jusqu'à un hard refresh.
        location = /index.html {
          add_header Cache-Control "no-cache";
        }

        location = /sw.js {
          add_header Cache-Control "no-cache";
        }

        location = /manifest.webmanifest {
          add_header Cache-Control "no-cache";
        }

        error_page  404              /404.html;

        error_page  500 502 503 504  /50x.html;
        location = /50x.html {
            root   /usr/share/nginx/html;
        }
    }
}