<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <radialGradient id="blueGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#4A7FC1"/>
      <stop offset="100%" stop-color="#003189"/>
    </radialGradient>
    <radialGradient id="redGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#E84040"/>
      <stop offset="100%" stop-color="#B00020"/>
    </radialGradient>
    <radialGradient id="darkBlueGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1A3C8F"/>
      <stop offset="100%" stop-color="#001870"/>
    </radialGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000030"/>
    </filter>
    <filter id="glowBlue">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#003189" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Grands pétales (6, alternés bleu/rouge) -->
  <ellipse cx="200" cy="200" rx="19" ry="62"
    transform="rotate(0 200 200) translate(0 -50)"
    fill="url(#darkBlueGrad)" filter="url(#shadow)"/>
  <ellipse cx="200" cy="200" rx="19" ry="62"
    transform="rotate(60 200 200) translate(0 -50)"
    fill="url(#redGrad)" filter="url(#shadow)"/>
  <ellipse cx="200" cy="200" rx="19" ry="62"
    transform="rotate(120 200 200) translate(0 -50)"
    fill="url(#blueGrad)" filter="url(#shadow)"/>
  <ellipse cx="200" cy="200" rx="19" ry="62"
    transform="rotate(180 200 200) translate(0 -50)"
    fill="url(#redGrad)" filter="url(#shadow)"/>
  <ellipse cx="200" cy="200" rx="19" ry="62"
    transform="rotate(240 200 200) translate(0 -50)"
    fill="url(#darkBlueGrad)" filter="url(#shadow)"/>
  <ellipse cx="200" cy="200" rx="19" ry="62"
    transform="rotate(300 200 200) translate(0 -50)"
    fill="url(#redGrad)" filter="url(#shadow)"/>

  <!-- Pétales secondaires (6, décalés 30°) -->
  <ellipse cx="200" cy="200" rx="12" ry="38"
    transform="rotate(30 200 200) translate(0 -32)" fill="#003189" opacity="0.9"/>
  <ellipse cx="200" cy="200" rx="12" ry="38"
    transform="rotate(90 200 200) translate(0 -32)" fill="#B00020" opacity="0.9"/>
  <ellipse cx="200" cy="200" rx="12" ry="38"
    transform="rotate(150 200 200) translate(0 -32)" fill="#003189" opacity="0.9"/>
  <ellipse cx="200" cy="200" rx="12" ry="38"
    transform="rotate(210 200 200) translate(0 -32)" fill="#B00020" opacity="0.9"/>
  <ellipse cx="200" cy="200" rx="12" ry="38"
    transform="rotate(270 200 200) translate(0 -32)" fill="#003189" opacity="0.9"/>
  <ellipse cx="200" cy="200" rx="12" ry="38"
    transform="rotate(330 200 200) translate(0 -32)" fill="#B00020" opacity="0.9"/>

  <!-- Cœur de la fleur -->
  <circle cx="200" cy="200" r="26" fill="#003189" filter="url(#glowBlue)"/>
  <circle cx="200" cy="200" r="19" fill="white"/>
  <circle cx="200" cy="200" r="12" fill="#B00020"/>
  <circle cx="200" cy="200" r="5"  fill="white"/>

</svg>
