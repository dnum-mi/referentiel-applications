services:
  postgres:
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
  backend:
    image: ${IMAGE_TAG}
    command: pnpm start:prod
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    volumes: !override
      - ./backend/coverage:/app/coverage
