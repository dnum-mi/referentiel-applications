services:
  backend:
    image: ${BACK_IMAGE_TAG}
    pull_policy: always
    environment:
      # #1985 : désactivation temporaire pendant la finalisation Passage2/IAP.
      # Réactiver enforce après validation des claims et des parcours forts/faibles.
      - AUTH_LEVEL_MODE=off
    build: !reset null
    command: !reset null
    volumes: !reset []

  client:
    image: ${FRONT_IMAGE_TAG}
    pull_policy: always
    ports:
      - 8080:8080
    volumes: !reset []
    command: !reset null

  prisma-studio: !reset null
