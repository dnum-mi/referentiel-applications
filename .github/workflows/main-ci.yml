name: Main CI

on:
  push:
    branches:
      - main
        -dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  build-backend:
    name: Build Backend
    uses: ./.github/workflows/build.yml
    with:
      image: ghcr.io/dnum-mi/referentiel-applications/backend
      context: ./backend

  build-frontend:
    name: Build Frontend
    uses: ./.github/workflows/build.yml
    with:
      image: ghcr.io/dnum-mi/referentiel-applications/frontend
      context: ./frontend

  test-format:
    name: Test Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Prettier check
        run: |
          npm install -g pnpm
          pnpm install --frozen-lockfile
          pnpm run format-check

  test-lint:
    name: Test Linting
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Run ESLint
        run: |
          npm install -g pnpm
          pnpm install --frozen-lockfile
          pnpm run lint

  test-backend:
    name: Test Backend
    needs: build-backend
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Start stack using docker compose
        run: IMAGE_TAG=${{ needs.build-backend.outputs.image_tag }} docker compose -f docker-compose.yml -f docker-compose.ci.yml up keycloak backend postgres -d
      - name: Wait for Keycloak to be ready
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:8082/realms/referentiel-applications/.well-known/openid-configuration; then
              echo "Keycloak is ready"
              exit 0
            fi
            echo "Waiting for Keycloak..."
            sleep 5
          done
          echo "Keycloak did not become ready in time"
          exit 1
      - run: docker compose exec backend pnpm prisma migrate deploy
      - run: docker compose exec backend pnpm run test:cov
      - name: Produce the coverage report
        uses: insightsengineering/coverage-action@v2
        with:
          coverage-summary-title: Backend Coverage Summary
          path: ./backend/coverage/cobertura-coverage.xml
          publish: true
          # threshold: 80
          diff-storage: _xml_coverage_reports_backend

  test-e2e-frontend:
    name: Test E2E Frontend
    needs: build-frontend
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Start stack using docker compose
        run: IMAGE_TAG=${{ needs.build-client.outputs.image_tag }} docker compose -f docker-compose.yml -f docker-compose.ci.yml up client backend postgres keycloak -d

      - name: Wait for Keycloak to be ready
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:8082/realms/referentiel-applications/.well-known/openid-configuration; then
              echo "Keycloak is ready"
              exit 0
            fi
            echo "Waiting for Keycloak..."
            sleep 5
          done
          echo "Keycloak did not become ready in time"
          exit 1

      - name: setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
          run_install: false

      - name: Run E2E tests with cypress
        uses: cypress-io/github-action@v6
        with:
          working-directory: ./frontend
          command: pnpm run cy:run
          install-command: pnpm install --frozen-lockfile
          record: false
          wait-on: "http://localhost:5173"
          wait-on-timeout: 12000
          config: |
            defaultCommandTimeout=10000
            pageLoadTimeout=60000

      - name: upload cypress screenshots
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: cypress-report-e2e
          path: |
            ./frontend/cypress/screenshots/
          retention-days: 14
