name: Main CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  build-backend:
    name: Build Backend
    uses: ./.github/workflows/build.yml
    with:
      image: ghcr.io/dnum-mi/referentiel-applications/backend
      context: ./backend
      target: prod

  build-frontend:
    name: Build Frontend
    uses: ./.github/workflows/build.yml
    with:
      image: ghcr.io/dnum-mi/referentiel-applications/frontend
      context: ./frontend
      target: prod

  test-lint:
    name: Test Linting
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Run ESLint
        run: |
          npm install -g pnpm
          pnpm install --frozen-lockfile
          pnpm run lint

  unit-tests:
    name: Unit Tests
    needs: [build-backend]
    uses: ./.github/workflows/tests-unit.yml
    with:
      backend_image_tag: ${{ needs.build-backend.outputs.image_tag }}
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}

  test-e2e:
    name: Run E2E tests
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v3
      - name: Start stack using docker compose
        run: IMAGE_TAG=${{ needs.build-backend.outputs.image_tag }} docker compose -f docker-compose.yml -f docker-compose.ci.yml up backend postgres keycloak -d
      - name: Install dependencies
        working-directory: ./frontend
        run: npm install -g pnpm && pnpm install --frozen-lockfile
      - name: Install Playwright Browsers
        working-directory: ./frontend
        run: pnpm exec playwright install --with-deps
      - name: Generate client
        working-directory: ./frontend
        run: pnpm openapi-ts
      - name: Run Playwright tests
        working-directory: ./frontend
        run: pnpm test:e2e
        env:
          API_BASE_URL: http://localhost:3500
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
