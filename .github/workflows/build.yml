name: Build

on:
  workflow_call:
    inputs:
      image:
        required: true
        type: string
      context:
        required: true
        type: string
      target:
        required: true
        type: string
      ref:
        description: Commit exact à construire, sinon référence de l'événement
        required: false
        type: string
        default: ""
      image_tag:
        description: Tag Docker explicite, sinon tags dérivés de l'événement
        required: false
        type: string
        default: ""
      version:
        description: Version embarquée, sinon nom de la référence de l'événement
        required: false
        type: string
        default: ""
    outputs:
      image_tag:
        value: ${{ jobs.build.outputs.image_tag }}
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          # Le SHA exact d'une release reste détaché. Les refs et tags permettent
          # à metadata-action (context: git) de l'identifier sans utiliser main.
          fetch-depth: 0
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ inputs.image }}
          context: ${{ inputs.ref != '' && 'git' || 'workflow' }}
          tags: ${{ inputs.image_tag != '' && format('type=raw,value={0}', inputs.image_tag) || '' }}
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          push: true
          pull: true
          tags: ${{ steps.meta.outputs.tags }}
          target: ${{ inputs.target }}
          build-args: |
            VERSION=${{ inputs.version || github.ref_name }}
