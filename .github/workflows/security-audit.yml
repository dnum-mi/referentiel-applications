name: Dependency Security Audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "**/package.json"
      - "**/pnpm-lock.yaml"
      - "**/pnpm-workspace.yaml"
      - ".github/scripts/audit-dependencies*"
      - ".nvmrc"
      - ".github/workflows/security-audit.yml"
  push:
    branches: [main]
    paths:
      - "**/package.json"
      - "**/pnpm-lock.yaml"
      - "**/pnpm-workspace.yaml"
      - ".github/scripts/audit-dependencies*"
      - ".nvmrc"
      - ".github/workflows/security-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    name: Audit (${{ matrix.directory }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        directory: [".", backend, frontend, e2e, qa/at-windows]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: ${{ matrix.directory }}/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Test the fail-closed audit guard
        run: node --test .github/scripts/audit-dependencies.test.mjs
      - name: Install locked dependencies without lifecycle scripts
        working-directory: ${{ matrix.directory }}
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Check all dependency advisories
        working-directory: ${{ matrix.directory }}
        env:
          AUDIT_REPORT_PATH: ${{ runner.temp }}/dependency-audit.json
          AUDIT_OFFICIAL_REPORT_PATH: ${{ runner.temp }}/dependency-audit-github.json
          GITHUB_TOKEN: ${{ github.token }}
        run: node "$GITHUB_WORKSPACE/.github/scripts/audit-dependencies.mjs"
      - name: Preserve the unmodified registry report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-audit-${{ strategy.job-index }}
          path: |
            ${{ runner.temp }}/dependency-audit.json
            ${{ runner.temp }}/dependency-audit-github.json
          retention-days: 7
