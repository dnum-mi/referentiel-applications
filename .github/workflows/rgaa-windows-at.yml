name: RGAA real NVDA Firefox French
on:
  push:
    paths:
      - "qa/at-windows/**"
      - ".github/workflows/rgaa-windows-at.yml"
  workflow_dispatch:
    inputs:
      product_head:
        description: Exact full product commit SHA to verify
        required: true
        type: string
      approve_jaws_install_use:
        description: Authorise the reviewed JAWS French demonstration on this disposable Windows runner
        type: boolean
        required: true
        default: false
permissions:
  contents: read
jobs:
  nvda-firefox:
    if: github.event.repository.private == false
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      RGAA_ALLOW_WINDOWS_AT: "1"
      RGAA_PRODUCT_HEAD: ${{ github.event_name == 'workflow_dispatch' && inputs.product_head || github.sha }}
      RGAA_PRODUCT_ROOT: ${{ github.workspace }}/product
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Preserve exact source and fixture line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v6
        with:
          path: driver
          persist-credentials: false
      - name: Validate immutable product identity and ephemeral runner
        run: |
          if ($env:RGAA_PRODUCT_HEAD -notmatch '^[0-9a-f]{40}$') { throw 'Full SHA required' }
          if ($env:GITHUB_ACTIONS -ne 'true' -or $env:RUNNER_OS -ne 'Windows') { throw 'Ephemeral Windows runner required' }
          if (Get-Process -Name nvda -ErrorAction SilentlyContinue) { throw 'Existing NVDA process found' }
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RGAA_PRODUCT_HEAD }}
          path: product
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.21.0
      - name: Install isolated locked driver dependencies
        working-directory: driver/qa/at-windows
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify rendered fixture and generator fingerprints
        working-directory: driver/qa/at-windows
        run: |
          New-Item -ItemType Directory -Force evidence | Out-Null
          git -C ../.. rev-parse HEAD | Set-Content evidence/driver-head.txt
          git -C $env:RGAA_PRODUCT_ROOT rev-parse HEAD | Set-Content evidence/product-head.txt
          node tools/verify-inputs.mjs | Tee-Object evidence/input-verification.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm type-check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm lint
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Configure only the ephemeral Windows runner and install the pinned real reader
        working-directory: driver/qa/at-windows
        run: |
          pnpm exec guidepup setup --ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm exec guidepup install nvda
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm exec playwright install firefox
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prove real French NVDA announcements before content assertions
        working-directory: driver/qa/at-windows
        env:
          RGAA_PHASE: smoke
        run: pnpm test:smoke
      - name: Read seven real rendered figures and three generated HTML alternatives
        working-directory: driver/qa/at-windows
        run: pnpm test:cases
      - name: Record and enforce reader cleanup
        if: always()
        working-directory: driver/qa/at-windows
        run: |
          New-Item -ItemType Directory -Force evidence | Out-Null
          $remaining = @(Get-Process -Name nvda -ErrorAction SilentlyContinue | Select-Object Id, ProcessName, SessionId)
          @{ at = (Get-Date).ToUniversalTime().ToString('o'); remainingNvda = $remaining } | ConvertTo-Json -Depth 4 | Set-Content evidence/cleanup-final.json
          if ($remaining.Count -gt 0) { throw 'NVDA remains active after finally cleanup' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rgaa-nvda-firefox-${{ env.RGAA_PRODUCT_HEAD }}
          path: |
            driver/qa/at-windows/evidence/
            driver/qa/at-windows/test-results/
            driver/qa/at-windows/fixtures/*provenance.json
            driver/qa/at-windows/fixtures/manifest.json
          retention-days: 14

  nvda-interactive:
    name: nvda-interactive (${{ matrix.group }})
    if: github.event.repository.private == false
    runs-on: windows-2022
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: forms
            test_files: tests/nvda-forms.spec.ts
          - group: graphs
            test_files: tests/nvda-graphs.spec.ts
          - group: controls
            test_files: tests/nvda-ui.spec.ts tests/nvda-suggestions.spec.ts
          - group: complex-forms
            test_files: tests/nvda-remaining.spec.ts
          - group: shared-controls
            test_files: tests/nvda-shared.spec.ts
          - group: application-forms
            test_files: tests/nvda-application.spec.ts
    env:
      RGAA_ALLOW_WINDOWS_AT: "1"
      RGAA_PRODUCT_HEAD: ${{ github.event_name == 'workflow_dispatch' && inputs.product_head || github.sha }}
      RGAA_PRODUCT_ROOT: ${{ github.workspace }}/product
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Preserve exact source and fixture line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v6
        with:
          path: driver
          persist-credentials: false
      - name: Validate immutable product identity and ephemeral runner
        run: |
          if ($env:RGAA_PRODUCT_HEAD -notmatch '^[0-9a-f]{40}$') { throw 'Full SHA required' }
          if ($env:GITHUB_ACTIONS -ne 'true' -or $env:RUNNER_OS -ne 'Windows') { throw 'Ephemeral Windows runner required' }
          if (Get-Process -Name nvda -ErrorAction SilentlyContinue) { throw 'Existing NVDA process found' }
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RGAA_PRODUCT_HEAD }}
          path: product
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.21.0
      - name: Install isolated locked driver dependencies
        working-directory: driver/qa/at-windows
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify rendered fixture and generator fingerprints
        working-directory: driver/qa/at-windows
        run: |
          New-Item -ItemType Directory -Force evidence | Out-Null
          git -C ../.. rev-parse HEAD | Set-Content evidence/driver-head.txt
          git -C $env:RGAA_PRODUCT_ROOT rev-parse HEAD | Set-Content evidence/product-head.txt
          node tools/verify-inputs.mjs | Tee-Object evidence/input-verification.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm type-check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm lint
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install the exact product client without lifecycle scripts
        working-directory: product/frontend
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Generate the client from the versioned local API contract
        working-directory: product/frontend
        run: |
          pnpm api:generate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path src/client/index.ts) -or -not (Test-Path src/client/types.gen.ts)) { throw 'Generated product API client is missing.' }
      - name: Configure only the ephemeral Windows runner and install the pinned real reader
        working-directory: driver/qa/at-windows
        run: |
          pnpm exec guidepup setup --ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm exec guidepup install nvda
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm exec playwright install firefox
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prove real French NVDA announcements before content assertions
        working-directory: driver/qa/at-windows
        env:
          RGAA_PHASE: smoke
        run: pnpm test:smoke
      - name: Activate production components with native NVDA commands
        working-directory: driver/qa/at-windows
        env:
          RGAA_PHASE: interactive
        run: node tools/run-interactive-isolated.mjs ${{ matrix.test_files }}
      - name: Record and enforce reader cleanup
        if: always()
        working-directory: driver/qa/at-windows
        run: |
          New-Item -ItemType Directory -Force evidence | Out-Null
          $remaining = @(Get-Process -Name nvda -ErrorAction SilentlyContinue | Select-Object Id, ProcessName, SessionId)
          @{ at = (Get-Date).ToUniversalTime().ToString('o'); remainingNvda = $remaining } | ConvertTo-Json -Depth 4 | Set-Content evidence/cleanup-final.json
          if ($remaining.Count -gt 0) { throw 'NVDA remains active after finally cleanup' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rgaa-nvda-interactive-${{ matrix.group }}-${{ env.RGAA_PRODUCT_HEAD }}
          path: |
            driver/qa/at-windows/evidence/
            driver/qa/at-windows/test-results/
            driver/qa/at-windows/fixtures/*provenance.json
            driver/qa/at-windows/fixtures/manifest.json
          retention-days: 14

  jaws-installer-static-acquisition:
    if: github.event.repository.private == false
    runs-on: windows-2022
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
        with:
          path: driver
          persist-credentials: false
      - name: Acquire and verify official JAWS 2025 multilingual installer without execution
        working-directory: driver/qa/at-windows
        run: |
          $files = @('tools/acquire-jaws-installer.ps1')
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          }
          & ./tools/acquire-jaws-installer.ps1 -OutputDirectory ./evidence/jaws-acquisition
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rgaa-jaws-installer-static-${{ github.sha }}
          path: driver/qa/at-windows/evidence/jaws-acquisition/installer-static-verification.json
          if-no-files-found: warn
          retention-days: 14

  jaws-french-witness:
    if: >-
      github.event.repository.private == false &&
      github.ref == 'refs/heads/fix/rgaa-accessibility-20261008' &&
      github.run_attempt == '1' &&
      ((github.event_name == 'workflow_dispatch' && inputs.approve_jaws_install_use == true) ||
       (github.event_name == 'push' && github.event.head_commit.message == 'test: retry approved JAWS focus 2026-10-13-b8d0'))
    runs-on: windows-2022
    # The initial failed preparation consumed 4m30, including installation.
    # This corrected attempt keeps the combined trial below 35 minutes.
    timeout-minutes: 30
    env:
      RGAA_PRODUCT_HEAD: ${{ github.event_name == 'workflow_dispatch' && inputs.product_head || github.sha }}
      RGAA_PRODUCT_ROOT: ${{ github.workspace }}/product
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Preserve exact source and fixture line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v6
        with:
          path: driver
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RGAA_PRODUCT_HEAD }}
          path: product
          persist-credentials: false
      - name: Enforce exact reviewed approval signal before preparing software
        working-directory: driver/qa/at-windows
        run: |
          $expectedBranch = 'refs/heads/fix/rgaa-accessibility-20261008'
          $expectedMessage = 'test: retry approved JAWS focus 2026-10-13-b8d0'
          if (-not $env:GITHUB_REF.Equals($expectedBranch, [StringComparison]::Ordinal) -or $env:GITHUB_RUN_ATTEMPT -ne '1') { throw 'Branch/attempt guard failed.' }
          $event = Get-Content -LiteralPath $env:GITHUB_EVENT_PATH -Raw | ConvertFrom-Json
          $approved = if ($env:GITHUB_EVENT_NAME -eq 'push') {
            $event.head_commit.message.Equals($expectedMessage, [StringComparison]::Ordinal)
          } else {
            [string]$event.inputs.approve_jaws_install_use -eq 'true'
          }
          if (-not $approved) { throw 'Exact explicit JAWS approval signal missing.' }
          New-Item -ItemType Directory -Force ./evidence/jaws-approved | Out-Null
          @{ approved = $true; source = $env:GITHUB_EVENT_NAME; package = '2025.2508.120.400'; eula = 'https://vispero.com/jaws-end-user-license-agreement/'; noPurchase = $true; noActivation = $true; rebootMayLimitResult = $true; installerStarted = $false; readerStarted = $false; initialFailedRun = '38424775281'; initialWholeJobSeconds = 270; correctedJobMaximumSeconds = 1800; retryPurpose = 'Correct Firefox foreground preparation before any native witness; no demo-time extension' } | ConvertTo-Json | Set-Content ./evidence/jaws-approved/approved-operation.json
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.21.0
      - name: Prepare isolated existing driver and Firefox
        working-directory: driver/qa/at-windows
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm exec playwright install firefox
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify exact product sources and static content before JAWS use
        working-directory: driver/qa/at-windows
        run: |
          if ($env:RGAA_PRODUCT_HEAD -notmatch '^[0-9a-f]{40}$') { throw 'Full SHA required' }
          git -C ../.. rev-parse HEAD | Set-Content evidence/jaws-approved/driver-head.txt
          git -C $env:RGAA_PRODUCT_ROOT rev-parse HEAD | Set-Content evidence/jaws-approved/product-head.txt
          node tools/verify-inputs.mjs | Tee-Object evidence/jaws-approved/input-verification.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Parse the exact scripts before any executable invocation
        working-directory: driver/qa/at-windows
        run: |
          $files = @('acquire-jaws-installer.ps1','capture-jaws-history.ps1','focus-browser-window.ps1','inspect-jaws-setup.ps1','install-jaws-approved.ps1','jaws-content-action.ps1')
          foreach ($name in $files) {
            $tokens = $null
            $errors = $null
            [Management.Automation.Language.Parser]::ParseFile((Resolve-Path "tools/$name"), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          }
          node --check tools/jaws-smoke.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check tools/jaws-content-cases.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Reacquire and verify exact signed package
        working-directory: driver/qa/at-windows
        run: |
          & ./tools/acquire-jaws-installer.ps1 -OutputDirectory ./evidence/jaws-approved -BinaryDirectory "$env:RUNNER_TEMP/jaws-approved"
      - name: Inspect official settings and current approved terms without installing
        working-directory: driver/qa/at-windows
        run: |
          powershell.exe -NoProfile -STA -File ./tools/inspect-jaws-setup.ps1 `
            -InstallerPath "$env:RUNNER_TEMP/jaws-approved/J2025.2508.120.400-any.exe" `
            -OutputDirectory ./evidence/jaws-approved -ApprovedJawsTerms
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: rgaa-jaws-before-installation-${{ github.sha }}
          path: driver/qa/at-windows/evidence/jaws-approved/*.json
          retention-days: 14
      - name: Official French installation, native witness and ten content cases
        working-directory: driver/qa/at-windows
        run: |
          powershell.exe -NoProfile -STA -File ./tools/install-jaws-approved.ps1 `
            -InstallerPath "$env:RUNNER_TEMP/jaws-approved/J2025.2508.120.400-any.exe" `
            -OutputDirectory ./evidence/jaws-approved -ApprovedJawsInstallAndUse
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain actual reader cleanup state
        if: always()
        working-directory: driver/qa/at-windows
        run: |
          New-Item -ItemType Directory -Force ./evidence/jaws-approved | Out-Null
          $remaining = @(Get-Process -Name jfw -ErrorAction SilentlyContinue | Select-Object Id,ProcessName,SessionId)
          @{ at = (Get-Date).ToUniversalTime().ToString('o'); remainingJaws = $remaining } | ConvertTo-Json -Depth 4 | Set-Content ./evidence/jaws-approved/cleanup-final.json
          if ($remaining.Count -gt 0) { throw 'Reader remains active; do not claim complete cleanup.' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rgaa-jaws-approved-${{ github.sha }}
          path: |
            driver/qa/at-windows/evidence/jaws-approved/*.json
            driver/qa/at-windows/evidence/jaws-approved/*.jsonl
            driver/qa/at-windows/evidence/jaws-approved/*.log
            driver/qa/at-windows/evidence/jaws-approved/*.png
            driver/qa/at-windows/evidence/jaws-approved/*-head.txt
            driver/qa/at-windows/evidence/jaws-approved/diagnostics/
            driver/qa/at-windows/evidence/jaws-approved/content-cases/
          if-no-files-found: warn
          retention-days: 14
