name: Test and scan

on:
  workflow_dispatch:
    inputs:
      backend_image_tag:
        description: Image backend à tester
        required: true
        type: string
  workflow_call:
    inputs:
      backend_image_tag:
        required: true
        type: string
    secrets:
      SONAR_TOKEN:
        required: false
      SONAR_HOST_URL:
        required: false
      SONAR_PROJECT_KEY:
        required: false

jobs:
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Start stack using docker compose
        run: IMAGE_TAG=${{ inputs.backend_image_tag }} docker compose -f docker-compose.yml -f docker-compose.ci.yml up backend keycloak postgres -d
      - name: Wait for backend to be ready
        run: |
          IMG=${{ inputs.backend_image_tag }}
          for i in $(seq 1 60); do
            if IMAGE_TAG=$IMG docker compose -f docker-compose.yml -f docker-compose.ci.yml exec -T backend \
                 node -e "require('http').get('http://localhost:3500/api/v2/health-check', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))" 2>/dev/null; then
              echo "✅ Backend ready after ~$((i * 3))s"
              exit 0
            fi
            echo "⏳ Waiting for backend to be ready ($i/60)..."
            sleep 3
          done
          echo "❌ Backend never became ready within 180s — diagnostics below:"
          IMAGE_TAG=$IMG docker compose -f docker-compose.yml -f docker-compose.ci.yml ps
          IMAGE_TAG=$IMG docker compose -f docker-compose.yml -f docker-compose.ci.yml logs backend
          exit 1
      - name: Wait for Keycloak to be ready
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:8082/realms/referentiel-applications/.well-known/openid-configuration; then
              echo "Keycloak is ready"
              exit 0
            fi
            echo "Waiting for Keycloak..."
            sleep 5
          done
          echo "Keycloak did not become ready in time"
          exit 1
      - name: Display backend logs for debugging
        run: IMAGE_TAG=${{ inputs.backend_image_tag }} docker compose -f docker-compose.yml -f docker-compose.ci.yml logs backend
      - name: Run migrations
        run: IMAGE_TAG=${{ inputs.backend_image_tag }} docker compose -f docker-compose.yml -f docker-compose.ci.yml exec backend pnpm prisma migrate deploy
      - name: Set permissions on coverage folder
        run: chmod -R 777 ./backend/coverage
      - name: Run test coverage
        run: IMAGE_TAG=${{ inputs.backend_image_tag }} docker compose -f docker-compose.yml -f docker-compose.ci.yml exec backend pnpm test:cov
      - name: Upload vitest coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: unit-tests-coverage
          path: ./backend/coverage/
          retention-days: 1
  coverage-report:
    name: Backend Coverage Report
    needs: test-backend
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    # Toutes les branches partagent le stockage des comparaisons. Seule cette
    # publication est sérialisée ; queue:max conserve aussi les PR en attente.
    concurrency:
      group: backend-coverage-storage
      queue: max
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: unit-tests-coverage
          path: ./backend/coverage
      - name: Produce coverage report
        uses: insightsengineering/coverage-action@v2
        with:
          coverage-summary-title: Backend Coverage Summary
          path: ./backend/coverage/cobertura-coverage.xml
          threshold: 70
          publish: true
          diff: true
          diff-storage: _xml_coverage_reports_backend

  scan-configuration:
    name: Sonar Configuration
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      enabled: ${{ steps.config.outputs.enabled }}
    steps:
      - name: Check optional Sonar configuration
        id: config
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
        run: |
          if [[ -z "$SONAR_TOKEN" && -z "$SONAR_HOST_URL" && -z "$SONAR_PROJECT_KEY" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Sonar non exécuté : les trois secrets sont absents (par exemple sur une PR de fork)." >> "$GITHUB_STEP_SUMMARY"
          elif [[ -z "$SONAR_TOKEN" || -z "$SONAR_HOST_URL" || -z "$SONAR_PROJECT_KEY" ]]; then
            echo "::error::Configuration Sonar incomplète : les trois secrets doivent être renseignés."
            exit 1
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

  code-scan:
    name: Code Scan
    needs: [test-backend, scan-configuration]
    if: needs.scan-configuration.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checks-out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: unit-tests-coverage
          path: ./coverage/backend
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.14.0
      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
      - name: Generate backend database schema
        run: cd backend && pnpm install --frozen-lockfile && pnpm db:generate
      - name: Generate frontend API schema
        run: cd frontend && pnpm install --frozen-lockfile && pnpm api:generate

      - name: Set sonarqube args
        id: sonar-args
        env:
          PR_NUMBER: ${{ github.event.number }}
          PR_HEAD_REF: ${{ github.head_ref }}
          PR_BASE_REF: ${{ github.base_ref }}
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          printf 'SONAR_ARGS_PR=%s\n' "-Dsonar.pullrequest.provider=github -Dsonar.pullrequest.key=$PR_NUMBER -Dsonar.pullrequest.branch=$PR_HEAD_REF -Dsonar.pullrequest.base=$PR_BASE_REF -Dsonar.pullrequest.github.repository=$REPOSITORY" >> "$GITHUB_OUTPUT"
          printf 'SONAR_ARGS_BRANCH=%s\n' "-Dsonar.branch.name=$REF_NAME" >> "$GITHUB_OUTPUT"

      - uses: SonarSource/sonarqube-scan-action@v6
        with:
          args: >
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}
            -Dsonar.javascript.lcov.reportPaths=coverage/backend/lcov.info
            -Dsonar.javascript.node.maxspace=4096
            -Dsonar.sources=backend,frontend
            -Dsonar.exclusions=backend/tests/**
            -Dsonar.coverage.exclusions=**/tests/**
            -Dsonar.tests=backend/tests
            -Dsonar.scm.provider=git
            -Dsonar.issue.ignore.multicriteria=e2699,emailWidth,emailLayout,emailRole
            -Dsonar.issue.ignore.multicriteria.e2699.ruleKey=typescript:S2699
            -Dsonar.issue.ignore.multicriteria.e2699.resourceKey=backend/tests/**
            -Dsonar.issue.ignore.multicriteria.emailWidth.ruleKey=Web:S1827
            -Dsonar.issue.ignore.multicriteria.emailWidth.resourceKey=backend/src/email/templates/**
            -Dsonar.issue.ignore.multicriteria.emailLayout.ruleKey=Web:S5257
            -Dsonar.issue.ignore.multicriteria.emailLayout.resourceKey=backend/src/email/templates/**
            -Dsonar.issue.ignore.multicriteria.emailRole.ruleKey=Web:S6819
            -Dsonar.issue.ignore.multicriteria.emailRole.resourceKey=backend/src/email/templates/**
            ${{ github.event_name == 'pull_request' && steps.sonar-args.outputs.SONAR_ARGS_PR || steps.sonar-args.outputs.SONAR_ARGS_BRANCH }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
