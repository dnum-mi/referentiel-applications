name: Test E2E
on:
  workflow_call:
    inputs:
      BACKEND_IMAGE_TAG:
        required: true
        type: string
      FRONTEND_IMAGE_TAG:
        required: true
        type: string

jobs:
  test-e2e-frontend:
    name: Test E2E Frontend
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Start stack using docker compose
        env:
          BACK_IMAGE_TAG: ${{ inputs.BACKEND_IMAGE_TAG }}
          FRONT_IMAGE_TAG: ${{ inputs.FRONTEND_IMAGE_TAG }}
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        working-directory: ./frontend
        run: npm install -g pnpm && pnpm install
      - name: Install Playwright Browsers
        working-directory: ./frontend
        run: pnpm exec playwright install --with-deps

      - name: Wait for Keycloak to be ready
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:8082/realms/referentiel-applications/.well-known/openid-configuration; then
              echo "Keycloak is ready"
              exit 0
            fi
            echo "Waiting for Keycloak..."
            sleep 5
          done
          echo "Keycloak did not become ready in time"
          exit 1

      - name: Wait for Frontend to be ready
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:8080 | grep -q "<title>Référentiel des applications</title>"; then
              echo "Frontend is ready"
              exit 0
            fi
            echo "Waiting for Frontend..."
            sleep 5
          done
          echo "Frontend did not become ready in time"
          exit 1

      - name: Check backend logs
        run: docker compose logs backend --since 1m || echo "No logs"

      - name: Run Playwright tests
        working-directory: ./frontend
        run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
